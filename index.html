        "Live streaming gratuit en temps réel",
        "Marketplace intégré avec paiement sécurisé",
        "Appels vidéo et audio HD chiffrés",

    <!-- JSON-LD: FAQPage (Rich Snippets Google) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Qu'est-ce que Forsure ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Forsure (forsure.fans) propose un fil réglable et une messagerie privée chiffrée. L'inscription est gratuite et la personnalisation publicitaire est facultative."
          }
        },
        {
          "@type": "Question",
          "name": "Pourquoi Forsure est le réseau social le plus sécurisé ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La messagerie Forsure utilise le moteur Libsignal avec PQXDH et Double Ratchet pour établir et renouveler les clés de session. Le contenu reste chiffré de bout en bout et la vérification d'identité par numéro de sécurité est incluse."
          }
        },
        {
          "@type": "Question",
          "name": "Comment les utilisateurs contrôlent l'algorithme sur Forsure ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Forsure est le premier réseau social à algorithme transparent et contrôlable. Vous choisissez votre mode de fil (intelligent, chronologique, amis d'abord). L'IA Zeus analyse les performances en temps réel et propose des ajustements que vous validez. Aucune manipulation cachée — vous décidez ce que vous voyez."
          }
        },
        {
          "@type": "Question",
          "name": "En quoi Forsure est différent de Facebook, Instagram ou TikTok ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ForSure associe un fil réglable, des outils de bien-être, une messagerie privée et des publicités identifiées dont la personnalisation reste facultative. Les conversations privées 1-à-1 utilisent Libsignal ; cela ne signifie pas que chaque fonction publique ou chaque appel utilise ce protocole."
          }
        },
        {
          "@type": "Question",
          "name": "Forsure est-il gratuit ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui, Forsure est 100% gratuit. Toutes les fonctionnalités sont accessibles sans frais : messagerie chiffrée Signal, contrôle de l'algorithme, live streaming, marketplace, appels vidéo, jeux multijoueur. Aucune carte bancaire requise."
          }
        },
        {
          "@type": "Question",
          "name": "La messagerie Forsure est-elle aussi sécurisée que Signal ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La messagerie Forsure s'appuie sur Libsignal : PQXDH établit les sessions, Double Ratchet renouvelle les clés et les numéros de sécurité permettent de vérifier l'identité. Forsure n'est ni affilié ni certifié par Signal."
          }
        },
        {
          "@type": "Question",
          "name": "Peut-on faire du live streaming sur Forsure ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Forsure propose des diffusions en direct avec chat et réactions. La disponibilité dépend des règles et capacités du service."
          }
        },
        {
          "@type": "Question",
          "name": "Forsure a-t-il un marketplace ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui, Forsure intègre un marketplace avec paiement sécurisé par Stripe et livraison via Mondial Relay. Achetez et vendez directement sur la plateforme, sans commission cachée."
          }
        }
      ]
    }
    </script>

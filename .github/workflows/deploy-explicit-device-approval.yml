name: Apply explicit device approval migration

on:
  push:
    branches:
      - ops/apply-explicit-device-approval
    paths:
      - supabase/migrations/20260806090000_require_explicit_device_approval.sql
      - .github/workflows/deploy-explicit-device-approval.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-explicit-device-approval
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PROJECT_REF: vkpmoqfzrihcijjochks
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MIGRATION_FILE: supabase/migrations/20260806090000_require_explicit_device_approval.sql

    steps:
      - uses: actions/checkout@v4

      - name: Require Supabase management token
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi

      - name: Apply explicit device approval migration
        shell: bash
        run: |
          jq -Rs '{query: ., read_only: false}' "$MIGRATION_FILE" > "$RUNNER_TEMP/migration-request.json"
          status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/migration-response.json" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/migration-request.json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query")"

          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "Supabase migration failed with HTTP $status" >&2
            jq . "$RUNNER_TEMP/migration-response.json" >&2 || true
            exit 1
          fi

      - name: Verify function security and privileges
        shell: bash
        run: |
          verification_sql="select
            p.prosecdef as security_definer,
            position('search_path=public, pg_temp' in array_to_string(coalesce(p.proconfig, array[]::text[]), ',')) > 0 as locked_search_path,
            exists (
              select 1
              from aclexplode(coalesce(p.proacl, acldefault('f', p.proowner))) acl
              join pg_roles role on role.oid = acl.grantee
              where role.rolname = 'authenticated'
                and acl.privilege_type = 'EXECUTE'
            ) as authenticated_execute,
            not exists (
              select 1
              from aclexplode(coalesce(p.proacl, acldefault('f', p.proowner))) acl
              where acl.grantee = 0
                and acl.privilege_type = 'EXECUTE'
            ) as public_execute_revoked,
            not exists (
              select 1
              from aclexplode(coalesce(p.proacl, acldefault('f', p.proowner))) acl
              join pg_roles role on role.oid = acl.grantee
              where role.rolname = 'anon'
                and acl.privilege_type = 'EXECUTE'
            ) as anon_execute_revoked,
            position('device_enrollment_challenges' in lower(pg_get_functiondef(p.oid))) > 0 as challenge_guard_present,
            position('consumed_at is not null' in lower(pg_get_functiondef(p.oid))) > 0 as consumed_guard_present,
            position('cancelled_at is null' in lower(pg_get_functiondef(p.oid))) > 0 as cancellation_guard_present
          from pg_proc p
          where p.oid = to_regprocedure('public.approve_user_device(text)');"

          jq -n --arg query "$verification_sql" \
            '{query: $query, read_only: true}' > "$RUNNER_TEMP/verification-request.json"

          status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/verification-response.json" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/verification-request.json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query")"

          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "Supabase verification failed with HTTP $status" >&2
            jq . "$RUNNER_TEMP/verification-response.json" >&2 || true
            exit 1
          fi

          jq -e '
            .. | objects |
            select(
              .security_definer == true
              and .locked_search_path == true
              and .authenticated_execute == true
              and .public_execute_revoked == true
              and .anon_execute_revoked == true
              and .challenge_guard_present == true
              and .consumed_guard_present == true
              and .cancellation_guard_present == true
            )
          ' "$RUNNER_TEMP/verification-response.json" > /dev/null

      - name: Publish migration status
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIGRATION_JOB_STATUS: ${{ job.status }}
        run: |
          case "$MIGRATION_JOB_STATUS" in
            success)
              state="success"
              description="Explicit device approval migration applied and verified"
              ;;
            failure)
              state="failure"
              description="Explicit device approval migration failed"
              ;;
            *)
              state="error"
              description="Explicit device approval migration did not complete"
              ;;
          esac

          jq -n \
            --arg state "$state" \
            --arg context "Supabase/explicit device approval" \
            --arg description "$description" \
            --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}' \
            > "$RUNNER_TEMP/status.json"

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$RUNNER_TEMP/status.json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" > /dev/null

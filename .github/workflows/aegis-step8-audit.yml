name: Aegis step 8 audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'refactor/aegis-clean-rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/aegis-clean-rebuild
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate privacy audit
        shell: bash
        run: |
          set -euo pipefail
          report="docs/AEGIS_STAGE8_AUDIT.txt"
          {
            echo "AEGIS STAGE 8 PRIVACY AUDIT"
            echo "HEAD=$(git rev-parse HEAD)"
            echo
            echo "=== EDGE FUNCTIONS ==="
            find supabase/functions -maxdepth 2 -type f 2>/dev/null | sort || true
            echo
            echo "=== PUSH / NOTIFICATION REFERENCES ==="
            rg -n -i --glob '!node_modules/**' --glob '!dist/**' \
              '(showNotification|pushManager|push_subscription|webpush|firebase.*messaging|fcm|apns|onesignal|send[-_ ]?push|notification)' \
              src public supabase 2>/dev/null || true
            echo
            echo "=== SENSITIVE LOG CANDIDATES ==="
            rg -n --glob '!node_modules/**' --glob '!dist/**' \
              '(console\.(log|warn|error|info|debug)|logger\.(log|warn|error|info|debug))' \
              src public supabase 2>/dev/null \
              | rg -i '(body|plaintext|content|message|payload|key|token|secret|cipher|archive|media|url|device|session|authorization|email|phone)' || true
            echo
            echo "=== SERVER-SIDE SENSITIVE FIELD REFERENCES ==="
            rg -n -i --glob '!node_modules/**' \
              '(plaintext|message_body|encrypted_body|archive_body|call_key|media_key|recovery_key|access_token|refresh_token|authorization|body|content|caption|preview|payload)' \
              supabase/functions 2>/dev/null || true
            echo
            echo "=== SERVER EXTERNAL REQUESTS ==="
            rg -n --glob '!node_modules/**' '(fetch\(|Deno\.serve|serve\()' supabase/functions 2>/dev/null || true
            echo
            echo "=== MESSAGE / NOTIFICATION SQL ==="
            rg -n -i '(notification|push|message|plaintext|content|preview|body)' supabase/migrations 2>/dev/null || true
            echo
            echo "=== CLIENT TELEMETRY / ERROR REPORTING ==="
            rg -n -i --glob '!node_modules/**' \
              '(sentry|posthog|analytics|telemetry|trackEvent|captureException|captureMessage|logCrypto)' \
              src supabase/functions 2>/dev/null || true
          } > "$report"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/aegis-step8-audit.yml
          git add "$report" .github/workflows/aegis-step8-audit.yml
          git commit -m "chore(aegis): record stage 8 privacy audit"
          git push origin HEAD:refactor/aegis-clean-rebuild

name: Verify approve-device-enrollment once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-approve-device-enrollment-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify missing JWT is rejected
        shell: bash
        run: |
          endpoint="https://vkpmoqfzrihcijjochks.supabase.co/functions/v1/approve-device-enrollment"
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            --request POST "$endpoint" \
            --header "Content-Type: application/json" \
            --data '{"device_id":"dev_00000000000000000000000000000000"}')
          cat response.json
          test "$status" = "401"

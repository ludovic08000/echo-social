name: Windows iOS E2EE Flow

on:
  push:
    branches:
      - fix/ios-passkey-web-cleanup
  pull_request:
    paths:
      - 'src/lib/crypto/**'
      - 'src/lib/messaging/**'
      - 'src/platforms/ios/**'
      - '.github/workflows/windows-ios-e2ee-flow.yml'

permissions:
  contents: read

jobs:
  windows-ios-e2ee:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Windows iOS E2EE contract tests
        run: >-
          npx vitest run
          src/lib/crypto/__tests__/windowsIosE2EEFlow.test.ts
          src/lib/crypto/__tests__/deviceRatchet.test.ts
          src/lib/crypto/__tests__/x3dhOpkClaim.test.ts
          src/lib/messaging/__tests__/aegisCrossPlatformDeviceCopy.test.ts
          src/platforms/ios/__tests__/iosMessagingProtection.test.ts

      - name: Typecheck
        run: npm run typecheck

name: Aegis Gateway Contract

on:
  pull_request:
    paths:
      - 'infra/aegis-server/**'
      - '.github/workflows/aegis-gateway.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/aegis-server/**'
      - '.github/workflows/aegis-gateway.yml'

permissions:
  contents: read

concurrency:
  group: aegis-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          node --check infra/aegis-server/server.mjs
          node --check infra/aegis-server/smoke-client.mjs

      - name: Gateway contract tests
        working-directory: infra/aegis-server
        run: npm test

name: Aegis step 4 cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Verify final stage 4 source
        shell: bash
        run: |
          set -euo pipefail
          test -f src/lib/crypto/crossTabLock.ts
          test -f src/lib/messaging/outboxVault.ts
          test -f src/lib/messaging/__tests__/outboxVault.test.ts
          test -f src/lib/messaging/__tests__/aegisCrossPlatformDeviceCopy.test.ts
          grep -q "idbOpen: indexedDB.open.bind(indexedDB)" src/lib/messaging/__tests__/aegisCrossPlatformDeviceCopy.test.ts
          grep -q "const now = vi.spyOn(Date, 'now')" src/lib/messaging/__tests__/outboxVault.test.ts

      - name: Remove temporary stage 4 payloads
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .aegis-stage4-parts
          rm -f .github/workflows/aegis-step4-blob-finalize.yml
          rm -f .github/workflows/aegis-step4-cleanup.yml
          git diff --check

      - name: Commit clean branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'chore(aegis): remove stage 4 staging artifacts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
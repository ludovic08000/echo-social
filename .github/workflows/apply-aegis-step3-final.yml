name: Apply Aegis step 3 final

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/aegis-clean-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact final patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/aegis-step3-final-payload/00 \
              .github/aegis-step3-final-payload/01 \
              .github/aegis-step3-final-payload/02 \
              .github/aegis-step3-final-payload/03 \
              .github/aegis-step3-final-payload/04 \
              .github/aegis-step3-final-payload/05 \
              .github/aegis-step3-final-payload/06 \
              .github/aegis-step3-final-payload/07 > /tmp/aegis-step3.b64
          base64 --decode /tmp/aegis-step3.b64 > /tmp/aegis-step3.tar.gz
          echo "028554e6cb99924fd4ef2a09f59d31a922bde2e274acb9f87b2496d6e09a5fda  /tmp/aegis-step3.tar.gz" | sha256sum --check
          tar -xzf /tmp/aegis-step3.tar.gz -C .
          rm -f src/lib/crypto/x3dhBundleRouter.ts
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted stage 3 tests
        run: |
          npx vitest run \
            src/e2ee-session/__tests__/deviceRegistryCache.test.ts \
            src/e2ee-session/__tests__/deviceRegistryTrust.test.ts \
            src/e2ee-session/__tests__/deviceRegistryFailClosed.test.ts \
            src/lib/crypto/__tests__/x3dhOpkClaim.test.ts \
            src/lib/messaging/__tests__/aegisStage3Architecture.test.ts \
            src/lib/messaging/__tests__/aegisStage3RouteGuards.test.ts \
            src/lib/crypto/__tests__/deviceRatchet.test.ts \
            src/lib/crypto/__tests__/multiDeviceFanoutOutOfOrder.test.ts \
            src/lib/crypto/__tests__/multiDeviceIntegration.test.ts
      - name: Full test suite
        run: npm run test
      - name: Build
        run: npm run build
      - name: Commit validated step 3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf .github/aegis-step3-final-payload
          rm -f .github/workflows/apply-aegis-step3-final.yml
          git add -A
          git commit -m "fix(aegis): complete account-authorized device routing"
          git push origin HEAD:refactor/aegis-clean-rebuild

name: Dependency security gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**', 'security/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-26
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified 2026-10-26
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inventory installed dependencies (including build and test tools)
        run: npm sbom --sbom-format=cyclonedx > dependency-sbom.json
      - name: Block high or critical dependency findings
        run: npm run security:audit
      - name: Preserve inventory even when the gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified 2026-10-26
        with:
          name: dependency-sbom-${{ github.sha }}
          path: dependency-sbom.json
          if-no-files-found: error
          retention-days: 30

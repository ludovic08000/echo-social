name: Apply Libsignal-only production purge

on:
  push:
    branches:
      - codex/apply-libsignal-purge
    paths:
      - .github/sql/verify-libsignal-purge.sql
      - .github/workflows/apply-libsignal-purge.yml
      - supabase/migrations/20260915213000_purge_legacy_message_crypto.sql

permissions:
  contents: read

concurrency:
  group: apply-libsignal-only-production-purge
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      github.repository == 'ludovic08000/echo-social' &&
      github.ref == 'refs/heads/codex/apply-libsignal-purge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF: vkpmoqfzrihcijjochks
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MIGRATION_FILE: supabase/migrations/20260915213000_purge_legacy_message_crypto.sql
      MIGRATION_SHA256: a565ab326da3e0621dc295401690f186143a7c53130960a78ad1642f76777f98
      VERIFICATION_FILE: .github/sql/verify-libsignal-purge.sql

    steps:
      - name: Checkout the exact deployment commit
        uses: actions/checkout@v4

      - name: Verify target and immutable migration payload
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ludovic08000/echo-social"
          test "$GITHUB_REF" = "refs/heads/codex/apply-libsignal-purge"
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          }
          actual_sha256="$(sha256sum "$MIGRATION_FILE" | awk '{print $1}')"
          if [ "$actual_sha256" != "$MIGRATION_SHA256" ]; then
            echo "Migration checksum mismatch; refusing production write" >&2
            exit 1
          fi

      - name: Apply the guarded atomic migration
        shell: bash
        run: |
          set -euo pipefail
          jq -Rs '{query: ., read_only: false}' "$MIGRATION_FILE" \
            > "$RUNNER_TEMP/migration-request.json"
          status="$(curl --silent --show-error \
            --max-time 300 \
            --output "$RUNNER_TEMP/migration-response.json" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/migration-request.json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query")"

          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "Libsignal purge rolled back or was rejected (HTTP $status)" >&2
            jq . "$RUNNER_TEMP/migration-response.json" >&2 || true
            exit 1
          fi
          echo "Guarded migration committed successfully"

      - name: Verify production postconditions
        shell: bash
        run: |
          set -euo pipefail
          jq -Rs '{query: ., read_only: true}' "$VERIFICATION_FILE" \
            > "$RUNNER_TEMP/verification-request.json"
          status="$(curl --silent --show-error \
            --max-time 120 \
            --output "$RUNNER_TEMP/verification-response.json" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/verification-request.json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query")"

          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "Postcondition query failed with HTTP $status" >&2
            jq . "$RUNNER_TEMP/verification-response.json" >&2 || true
            exit 1
          fi

          jq . "$RUNNER_TEMP/verification-response.json"
          jq -e '
            .. | objects |
            select(
              .messages == 0 and
              .message_device_copies == 0 and
              .device_copy_retry_requests == 0 and
              .aegis_device_inbox == 0 and
              .message_archives == 0 and
              .aegis_view_once_consumptions == 0 and
              .aegis_view_once_payloads == 0 and
              .message_deletions == 0 and
              .message_reactions == 0 and
              .message_device_retry_requests == 0 and
              .user_devices == 20 and
              .libsignal_bundles == 40 and
              .libsignal_bundle_devices == 2 and
              .libsignal_bundle_users == 1 and
              .devices_missing_bundle == 18 and
              .invalid_repair_routes == 0 and
              .profiles == 10 and
              .conversations == 33 and
              .conversation_participants == 35 and
              .friendships == 18 and
              .posts == 57 and
              .user_backups == 2 and
              .user_crypto_state == 5 and
              .user_public_keys == 20 and
              .no_device_signed_prekeys == true and
              .no_device_one_time_prekeys == true and
              .no_user_signed_prekeys == true and
              .no_device_prekey_repair_requests == true and
              .no_aegis_x3dh_initial_replay == true and
              .no_x3dh_replay_ledger == true and
              .libsignal_wire_constraint_validated == true and
              .sesame_is_libsignal_only == true and
              .revoke_is_libsignal_only == true and
              .legacy_functions == 0 and
              .legacy_cron_jobs == 0
            )
          ' "$RUNNER_TEMP/verification-response.json" > /dev/null
          echo "Libsignal-only production postconditions verified"

name: Deploy ML feed trainer

on:
  push:
    branches:
      - main
    paths:
      - supabase/functions/ml-feed-train/**
      - supabase/functions/_shared/auth-guard.ts
      - supabase/functions/_shared/semantic-mmr.ts
      - supabase/config.toml
      - .github/workflows/deploy-ml-feed-train.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ml-feed-train-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: vkpmoqfzrihcijjochks
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Validate deployment credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          }

      - name: Deploy authenticated feed trainer
        run: |
          supabase functions deploy ml-feed-train \
            --project-ref "$SUPABASE_PROJECT_REF"

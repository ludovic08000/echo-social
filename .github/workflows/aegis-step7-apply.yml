name: Aegis step 7 apply
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: aegis-step-7-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply stage 7 integration
        run: node scripts/aegis-step7-patch.mjs
      - name: Verify architecture
        run: |
          test -f src/lib/messaging/aegisViewOnce.ts
          test -f src/components/messages/ViewOnceMessage.tsx
          test -f supabase/migrations/20260730050000_aegis_view_once_consumption.sql
          grep -q "begin_aegis_view_once_consume" supabase/migrations/20260730050000_aegis_view_once_consumption.sql
          grep -q "commit_aegis_view_once_consume" supabase/migrations/20260730050000_aegis_view_once_consumption.sql
          grep -q "purgeMessageLocalState" src/hooks/useMessages.ts
          grep -q "!message.view_once" src/hooks/useMessages.ts
          ! grep -n "archiveBubbleForUser" src/lib/messaging/aegisViewOnce.ts
          ! grep -n "savePlaintext" src/lib/messaging/aegisViewOnce.ts
      - run: npx vitest run src/lib/messaging/__tests__/aegisViewOnceProtocol.test.ts
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Publish validated stage 7 integration
        run: |
          rm scripts/aegis-step7-patch.mjs .github/workflows/aegis-step7-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No stage 7 changes to publish"
            exit 1
          fi
          git commit -m "feat(aegis): complete destructive view-once lifecycle"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

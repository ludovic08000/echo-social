name: PR53 deep audit runner

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/pr53-deep-audit-runner.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.head_ref == 'agent/aegis-pin-recovery-continuity-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aegis-pin-recovery-continuity-fix
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Extract and apply audited patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/pr53-deep-audit-fixes.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Install dependencies"
          if start_marker not in workflow or end_marker not in workflow:
              raise SystemExit('temporary patch workflow markers not found')
          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(script), 'pr53-deep-audit-patch.py', 'exec'))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Targeted recovery tests
        run: >-
          npm test --
          src/lib/crypto/__tests__/aegisPinRecoveryContinuity.test.ts
          src/lib/crypto/__tests__/peerKeyCacheForceRefresh.test.ts
          src/e2ee-session/__tests__/deviceRegistryFailClosed.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr53-deep-audit-fixes.yml
          git rm .github/workflows/pr53-deep-audit-runner.yml
          git add src
          git commit -m "fix(aegis): close recovery continuity audit gaps"
          git push origin HEAD:agent/aegis-pin-recovery-continuity-fix

name: Deploy positive editorial media

on:
  push:
    branches:
      - main
    paths:
      - supabase/migrations/20261008170000_positive_editorial_media.sql
      - supabase/migrations/20261008195531_separate_news_preferences_from_adult_ads.sql
      - supabase/migrations/20261008200503_retire_automatic_photo_age_flags.sql
      - supabase/migrations/20261008203014_disable_parental_controls.sql
      - supabase/migrations/20261008204946_fresh_daily_sport_media.sql
      - supabase/migrations/20261008210755_align_editorial_media_with_user_ml.sql
      - supabase/functions/_shared/rss-catalog.ts
      - supabase/functions/partner-rss-sync/**
      - .github/workflows/deploy-positive-editorial-media.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-positive-editorial-media
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROJECT_REF: vkpmoqfzrihcijjochks
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RELEASE_MIGRATIONS: >-
        supabase/migrations/20261008195531_separate_news_preferences_from_adult_ads.sql
        supabase/migrations/20261008200503_retire_automatic_photo_age_flags.sql
        supabase/migrations/20261008203014_disable_parental_controls.sql
        supabase/migrations/20261008204946_fresh_daily_sport_media.sql
        supabase/migrations/20261008210755_align_editorial_media_with_user_ml.sql

    steps:
      - uses: actions/checkout@v4

      - name: Require Lovable Cloud deployment token
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi

      - name: Verify backend prerequisites without reading secrets
        id: preflight
        shell: bash
        run: |
          verification_sql="select
            to_regclass('public.media_partners') is not null as partners_ready,
            to_regclass('public.partner_rss_sources') is not null as sources_ready,
            to_regclass('public.partner_media_items') is not null as items_ready,
            to_regprocedure('private.partner_rss_daily_tick()') is not null as tick_ready,
            to_regclass('vault.secrets') is not null as vault_ready,
            to_regclass('vault.decrypted_secrets') is not null as decrypted_vault_ready;"
          jq -n --arg query "$verification_sql" '{query: $query, read_only: true}' > "$RUNNER_TEMP/preflight-request.json"
          status="$(curl --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --max-time 30 \
            --output "$RUNNER_TEMP/preflight-response.json" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/preflight-request.json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query")"
          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            error_code="$(jq -r '(.error_code // .code // .error // "unknown") | tostring | gsub("[^A-Za-z0-9_.:-]"; "_") | .[0:80]' "$RUNNER_TEMP/preflight-response.json" 2>/dev/null || echo unknown)"
            echo "::error title=Lovable Cloud preflight::HTTP $status, code=$error_code" >&2
            exit 1
          fi
          row="$(jq -c 'first(.. | objects | select(has("partners_ready"))) // empty' "$RUNNER_TEMP/preflight-response.json")"
          if [ -z "$row" ]; then
            echo "::error title=Lovable Cloud preflight::Unexpected database response shape" >&2
            exit 1
          fi
          read -r partners_ready sources_ready items_ready tick_ready vault_ready decrypted_vault_ready <<< "$(jq -r '[.partners_ready,.sources_ready,.items_ready,.tick_ready,.vault_ready,.decrypted_vault_ready] | @tsv' <<< "$row")"
          echo "Lovable Cloud prerequisites: partners=$partners_ready sources=$sources_ready items=$items_ready tick=$tick_ready vault=$vault_ready decrypted_vault=$decrypted_vault_ready"
          if [ "$partners_ready" != "true" ] || [ "$sources_ready" != "true" ] || [ "$items_ready" != "true" ] || [ "$tick_ready" != "true" ] || [ "$vault_ready" != "true" ] || [ "$decrypted_vault_ready" != "true" ]; then
            echo "::error title=Lovable Cloud preflight::One or more required database objects are missing" >&2
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Type-check the RSS worker
        run: npx --yes deno@2.5.3 check --config supabase/functions/partner-rss-sync/deno.json supabase/functions/partner-rss-sync/index.ts

      - name: Rotate the RSS scheduler secret and deploy without interruption
        shell: bash
        run: |
          scheduler_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$scheduler_secret"
          umask 077
          secret_env="$RUNNER_TEMP/rss-scheduler.env"
          vault_request="$RUNNER_TEMP/rss-vault-request.json"
          vault_response="$RUNNER_TEMP/rss-vault-response.json"
          verify_request="$RUNNER_TEMP/rss-vault-verify-request.json"
          verify_response="$RUNNER_TEMP/rss-vault-verify-response.json"
          trap 'rm -f "$secret_env" "$vault_request" "$vault_response" "$verify_request" "$verify_response"' EXIT

          # Stage the new value while the current primary remains accepted.
          printf 'PARTNER_RSS_ENABLED=true\nPARTNER_RSS_CRON_SECRET_NEXT=%s\n' "$scheduler_secret" > "$secret_env"
          supabase secrets set --env-file "$secret_env" --project-ref "$PROJECT_REF"
          supabase functions deploy partner-rss-sync \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt

          vault_sql="do \$rss_rotation\$
          declare existing_secret_id uuid;
          begin
            select id into existing_secret_id
            from vault.secrets
            where name='partner_rss_cron_secret'
            order by created_at desc
            limit 1;
            if existing_secret_id is null then
              perform vault.create_secret('$scheduler_secret','partner_rss_cron_secret','ForSure partner RSS scheduler');
            else
              perform vault.update_secret(existing_secret_id,'$scheduler_secret','partner_rss_cron_secret','ForSure partner RSS scheduler');
            end if;
          end
          \$rss_rotation\$;"
          jq -n --arg query "$vault_sql" '{query: $query, read_only: false}' > "$vault_request"
          status="$(curl --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --max-time 30 \
            --output "$vault_response" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$vault_request" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query")"
          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            error_code="$(jq -r '(.error_code // .code // .error // "unknown") | tostring | gsub("[^A-Za-z0-9_.:-]"; "_") | .[0:80]' "$vault_response" 2>/dev/null || echo unknown)"
            echo "::error title=RSS scheduler Vault rotation::HTTP $status, code=$error_code" >&2
            exit 1
          fi

          verify_sql="select exists (
            select 1 from vault.decrypted_secrets
            where name='partner_rss_cron_secret'
              and length(decrypted_secret) between 32 and 256
          ) as scheduler_secret_ready;"
          jq -n --arg query "$verify_sql" '{query: $query, read_only: true}' > "$verify_request"
          status="$(curl --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --max-time 30 \
            --output "$verify_response" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$verify_request" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query")"
          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "::error title=RSS scheduler Vault verification::HTTP $status" >&2
            exit 1
          fi
          scheduler_secret_ready="$(jq -r 'first(.. | objects | select(has("scheduler_secret_ready"))) | .scheduler_secret_ready // false' "$verify_response")"
          if [ "$scheduler_secret_ready" != "true" ]; then
            echo "::error title=RSS scheduler Vault verification::Encrypted scheduler secret is unavailable" >&2
            exit 1
          fi

          # Promote only after Vault accepts the staged value. The worker accepts
          # both slots throughout the transition, so a partial run stays routable.
          printf 'PARTNER_RSS_ENABLED=true\nPARTNER_RSS_CRON_SECRET=%s\n' "$scheduler_secret" > "$secret_env"
          supabase secrets set --env-file "$secret_env" --project-ref "$PROJECT_REF"
          supabase secrets unset PARTNER_RSS_CRON_SECRET_NEXT --project-ref "$PROJECT_REF"

      - name: Apply the validated release migrations in order
        id: migrate
        shell: bash
        run: |
          for migration_file in $RELEASE_MIGRATIONS; do
            echo "Applying $(basename "$migration_file")"
            jq -Rs '{query: ., read_only: false}' "$migration_file" > "$RUNNER_TEMP/release-migration.json"
            status="$(curl --silent --show-error \
              --retry 3 \
              --retry-all-errors \
              --max-time 60 \
              --output "$RUNNER_TEMP/release-migration-response.json" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary "@$RUNNER_TEMP/release-migration.json" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query")"
            if [ "$status" != "200" ] && [ "$status" != "201" ]; then
              error_code="$(jq -r '(.error_code // .code // .error // "unknown") | tostring | gsub("[^A-Za-z0-9_.:-]"; "_") | .[0:80]' "$RUNNER_TEMP/release-migration-response.json" 2>/dev/null || echo unknown)"
              echo "::error title=Lovable Cloud migration::$(basename "$migration_file") failed with HTTP $status, code=$error_code" >&2
              exit 1
            fi
          done

      - name: Verify feed vision and safety schema
        shell: bash
        run: |
          verification_sql="select
            exists (
              select 1 from information_schema.columns
              where table_schema='public' and table_name='user_feed_preferences' and column_name='weight_news'
            ) as news_weight_ready,
            to_regprocedure('public.feed_normalize_topic(text)') is not null as topic_normalizer_ready,
            to_regprocedure('public.set_news_discovery_preferences(jsonb)') is not null as news_preferences_ready,
            to_regprocedure('public.force_parental_controls_disabled()') is not null as parental_kill_switch_ready,
            not exists (
              select 1 from public.parental_controls
              where is_active is distinct from false or is_minor is distinct from false
            ) as parental_rows_disabled,
            exists (
              select 1 from public.media_partners
              where active and editorial_category='sport'
            ) as sport_lane_ready;"
          jq -n --arg query "$verification_sql" '{query: $query, read_only: true}' > "$RUNNER_TEMP/release-verification.json"
          status="$(curl --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --max-time 30 \
            --output "$RUNNER_TEMP/release-verification-response.json" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/release-verification.json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query")"
          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "::error title=Lovable Cloud release verification::HTTP $status" >&2
            exit 1
          fi
          row="$(jq -c 'first(.. | objects | select(has("news_weight_ready"))) // empty' "$RUNNER_TEMP/release-verification-response.json")"
          if [ -z "$row" ] || [ "$(jq -r '[.news_weight_ready,.topic_normalizer_ready,.news_preferences_ready,.parental_kill_switch_ready,.parental_rows_disabled,.sport_lane_ready] | all' <<< "$row")" != "true" ]; then
            echo "::error title=Lovable Cloud release verification::Validated feed schema is incomplete" >&2
            exit 1
          fi

      - name: Verify fresh science, music, education, wellbeing and sport items
        shell: bash
        run: |
          verification_sql="with target_sources as (
            select s.*,p.editorial_category,p.id as media_partner_id
            from public.partner_rss_sources s
            join public.media_partners p on p.id=s.partner_id
            where s.source_key=any(array[
              'cnrs-journal','futura-sciences','pour-la-science','le-monde-sciences',
              'the-conversation-education','le-monde-education','cafe-pedagogique',
              'le-monde-musiques','france-musique','tsugi',
              'the-conversation-sante','psychologies','sante-publique-france-sante-mentale',
              'le-monde-sport','franceinfo-sports','rmc-sport'
            ]::text[])
          ), live_items as (
            select distinct p.editorial_category,m.id
            from public.partner_media_items m
            join public.media_partners p on p.id=m.partner_id
            join target_sources s on s.media_partner_id=p.id
            where p.active and p.rights_until>now() and m.moderated
              and m.published_at<=now() and m.published_at>now()-interval '36 hours'
              and m.expires_at>now()
          ) select
            (select count(*)::integer from target_sources) as source_count,
            (select count(*)::integer from target_sources where last_success_at is not null) as success_count,
            (select count(*)::integer from target_sources where last_status='failure') as failed_count,
            (select count(*)::integer from live_items) as item_count,
            (select count(distinct editorial_category)::integer from live_items) as category_count;"

          for attempt in 1 2 3 4 5 6 7 8; do
            jq -n --arg query "$verification_sql" '{query: $query, read_only: true}' > "$RUNNER_TEMP/editorial-media-verification.json"
            status="$(curl --silent --show-error \
              --output "$RUNNER_TEMP/editorial-media-verification-response.json" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary "@$RUNNER_TEMP/editorial-media-verification.json" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query")"
            if [ "$status" != "200" ] && [ "$status" != "201" ]; then
              echo "Lovable Cloud editorial-media verification failed with HTTP $status" >&2
              exit 1
            fi
            values="$(jq -r 'first(.. | objects | select(has("source_count"))) | [.source_count,.success_count,.failed_count,.item_count,.category_count] | @tsv' "$RUNNER_TEMP/editorial-media-verification-response.json")"
            read -r source_count success_count failed_count item_count category_count <<< "$values"
            echo "Editorial media: sources=$source_count successful=$success_count failed=$failed_count live_items=$item_count categories=$category_count"
            if [ "$source_count" = "16" ] && [ "${item_count:-0}" -ge 5 ] && [ "$category_count" = "5" ]; then
              exit 0
            fi
            sleep 15
          done

          echo "The five editorial lanes were not populated before the verification timeout" >&2
          exit 1

      - name: Disable only the new sport sources after a failed verification
        if: failure() && steps.migrate.outcome == 'success'
        shell: bash
        run: |
          rollback_sql="begin;
            update public.partner_rss_sources
            set enabled=false,lease_token=null,lease_until=null
            where source_key=any(array[
              'le-monde-sport','franceinfo-sports','rmc-sport'
            ]::text[]);
            update public.media_partners
            set active=false
            where agreement_reference=any(array[
              'operator-confirmed:2026-10-08:le-monde-sport',
              'operator-confirmed:2026-10-08:franceinfo-sports',
              'operator-confirmed:2026-10-08:rmc-sport'
            ]::text[]);
          commit;"
          jq -n --arg query "$rollback_sql" '{query: $query, read_only: false}' > "$RUNNER_TEMP/editorial-media-rollback.json"
          status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/editorial-media-rollback-response.json" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/editorial-media-rollback.json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query")"
          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "Automatic rollback failed with HTTP $status" >&2
            exit 1
          fi

name: Repair Privacy Baseline

on:
  push:
    branches:
      - 'fix/device-lifecycle-signal-order'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/device-lifecycle-signal-order
      - name: Reconstruct missing privacy_settings baseline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/migrations/20260206052233_8fbcde5e-10ab-46ba-a586-81784dd91221.sql')
          s = p.read_text()
          marker = '-- =============================================\n-- PHASE 1: Humeur du jour (mood on profiles)'
          if s.count(marker) != 1:
              raise SystemExit('unexpected privacy migration marker state')
          baseline = '''-- Reconstruct the privacy_settings baseline that exists in production but was\n-- missing from the migration history. This keeps fresh resets deterministic.\nCREATE TABLE IF NOT EXISTS public.privacy_settings (\n  id uuid NOT NULL DEFAULT gen_random_uuid() PRIMARY KEY,\n  user_id uuid NOT NULL UNIQUE,\n  profile_visibility text NOT NULL DEFAULT 'public' CHECK (profile_visibility = ANY (ARRAY['public'::text, 'friends'::text, 'private'::text])),\n  posts_visibility text NOT NULL DEFAULT 'public' CHECK (posts_visibility = ANY (ARRAY['public'::text, 'friends'::text, 'private'::text])),\n  comments_allowed text NOT NULL DEFAULT 'everyone' CHECK (comments_allowed = ANY (ARRAY['everyone'::text, 'friends'::text, 'nobody'::text])),\n  likes_visibility text NOT NULL DEFAULT 'public' CHECK (likes_visibility = ANY (ARRAY['public'::text, 'friends'::text, 'private'::text])),\n  messages_allowed text NOT NULL DEFAULT 'everyone' CHECK (messages_allowed = ANY (ARRAY['everyone'::text, 'friends'::text, 'nobody'::text])),\n  friends_list_visibility text NOT NULL DEFAULT 'friends' CHECK (friends_list_visibility = ANY (ARRAY['public'::text, 'friends'::text, 'private'::text])),\n  online_status_visibility text NOT NULL DEFAULT 'friends' CHECK (online_status_visibility = ANY (ARRAY['everyone'::text, 'friends'::text, 'nobody'::text])),\n  search_engine_indexing boolean NOT NULL DEFAULT false,\n  analytics_enabled boolean NOT NULL DEFAULT false,\n  created_at timestamp with time zone NOT NULL DEFAULT now(),\n  updated_at timestamp with time zone NOT NULL DEFAULT now()\n);\n\nALTER TABLE public.privacy_settings ENABLE ROW LEVEL SECURITY;\n\nDO $$\nBEGIN\n  IF NOT EXISTS (SELECT 1 FROM pg_policies WHERE schemaname='public' AND tablename='privacy_settings' AND policyname='Users can view their own privacy settings') THEN\n    CREATE POLICY "Users can view their own privacy settings" ON public.privacy_settings FOR SELECT USING (auth.uid() = user_id);\n  END IF;\n  IF NOT EXISTS (SELECT 1 FROM pg_policies WHERE schemaname='public' AND tablename='privacy_settings' AND policyname='Users can insert their own privacy settings') THEN\n    CREATE POLICY "Users can insert their own privacy settings" ON public.privacy_settings FOR INSERT WITH CHECK (auth.uid() = user_id);\n  END IF;\n  IF NOT EXISTS (SELECT 1 FROM pg_policies WHERE schemaname='public' AND tablename='privacy_settings' AND policyname='Users can update their own privacy settings') THEN\n    CREATE POLICY "Users can update their own privacy settings" ON public.privacy_settings FOR UPDATE USING (auth.uid() = user_id);\n  END IF;\nEND $$;\n\nDROP TRIGGER IF EXISTS update_privacy_settings_updated_at ON public.privacy_settings;\nCREATE TRIGGER update_privacy_settings_updated_at\n  BEFORE UPDATE ON public.privacy_settings\n  FOR EACH ROW EXECUTE FUNCTION public.update_updated_at_column();\n\n'''
          s = s.replace(marker, baseline + marker)
          s = s.replace('ALTER TABLE public.privacy_settings ADD COLUMN ghost_mode boolean NOT NULL DEFAULT false;', 'ALTER TABLE public.privacy_settings ADD COLUMN IF NOT EXISTS ghost_mode boolean NOT NULL DEFAULT false;')
          s = s.replace('ALTER TABLE public.privacy_settings ADD COLUMN detox_schedule jsonb DEFAULT NULL;', 'ALTER TABLE public.privacy_settings ADD COLUMN IF NOT EXISTS detox_schedule jsonb DEFAULT NULL;')
          s = s.replace('ALTER TABLE public.privacy_settings ADD COLUMN daily_limit_minutes integer DEFAULT NULL;', 'ALTER TABLE public.privacy_settings ADD COLUMN IF NOT EXISTS daily_limit_minutes integer DEFAULT NULL;')
          p.write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only)" = 'supabase/migrations/20260206052233_8fbcde5e-10ab-46ba-a586-81784dd91221.sql'
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - name: Validate complete migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          supabase db reset
          supabase test db
      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --no-backup
      - name: Commit only after SQL validation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260206052233_8fbcde5e-10ab-46ba-a586-81784dd91221.sql
          git commit -m 'fix(sql): restore privacy settings migration baseline'
          git push origin HEAD:fix/device-lifecycle-signal-order

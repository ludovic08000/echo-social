# CI retrigger: validate native iOS build after storyboard integration fix
name: Build Aegis libsignal iOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-libsignal-ios.yml
      - scripts/bootstrap-ios-native.sh
      - scripts/integrate-ios-native.rb
      - native/aegis-crypto/**
      - third_party/libsignal/**
      - ios/**
      - src/lib/crypto/libsignalPlatformBridge.ts
      - src/lib/crypto/libsignalRuntime.ts
      - src/lib/crypto/libsignalProvisioning.ts
  push:
    branches: [main, integrate-libsignal-native]
    paths:
      - .github/workflows/build-libsignal-ios.yml
      - scripts/bootstrap-ios-native.sh
      - scripts/integrate-ios-native.rb
      - native/aegis-crypto/**
      - third_party/libsignal/**
      - ios/**
      - src/lib/crypto/libsignalPlatformBridge.ts
      - src/lib/crypto/libsignalRuntime.ts
      - src/lib/crypto/libsignalProvisioning.ts

permissions:
  contents: read

jobs:
  ios-native:
    strategy:
      fail-fast: false
      matrix:
        variant: [social, messenger]
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      RUSTUP_TOOLCHAIN: nightly-2026-07-15
      FORSURE_APP_VARIANT: ${{ matrix.variant }}
      VITE_APP_VARIANT: ${{ matrix.variant }}

    steps:
      - name: Check out Echo Social
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Bootstrap, link and compile native iOS application
        shell: bash
        run: |
          set -o pipefail
          bash scripts/bootstrap-ios-native.sh 2>&1 | tee ios-native-build.log

      - name: Upload iOS build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-build-log-${{ matrix.variant }}
          path: ios-native-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Package iOS framework
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/ios/AegisCrypto.xcframework build/ios/AegisCrypto.xcframework.zip
          shasum -a 256 build/ios/AegisCrypto.xcframework.zip > build/ios/AegisCrypto.xcframework.zip.sha256
          ditto -c -k --sequesterRsrc --keepParent build/ios/${{ matrix.variant }}-device/Build/Products/Release-iphoneos/App.app build/ios/forsure-${{ matrix.variant }}-unsigned-device.app.zip
          ditto -c -k --sequesterRsrc --keepParent build/ios/${{ matrix.variant }}-simulator/Build/Products/Debug-iphonesimulator/App.app build/ios/forsure-${{ matrix.variant }}-simulator.app.zip

      - name: Upload integrated iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aegis-libsignal-ios-integrated-${{ matrix.variant }}
          path: |
            build/ios/AegisCrypto.xcframework.zip
            build/ios/AegisCrypto.xcframework.zip.sha256
            build/ios/forsure-${{ matrix.variant }}-unsigned-device.app.zip
            build/ios/forsure-${{ matrix.variant }}-simulator.app.zip
            native/aegis-crypto/bindings/ios/AegisCryptoNative.swift
            ios/App/App.xcodeproj/project.pbxproj
            ios/App/App/AegisCryptoNative.swift
            ios/App/App/LibSignalPlugin.swift
            ios/App/App/BridgeViewController.swift
          if-no-files-found: error
          retention-days: 14

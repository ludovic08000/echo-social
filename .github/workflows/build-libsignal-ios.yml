name: Build Aegis libsignal iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-libsignal-ios.yml
      - native/aegis-crypto/**
      - third_party/libsignal/**

permissions:
  contents: read

jobs:
  xcframework:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      RUSTUP_TOOLCHAIN: nightly-2026-07-15
    steps:
      - name: Check out Echo Social
        uses: actions/checkout@v4
      - name: Install pinned Rust and iOS targets
        run: |
          rustup toolchain install nightly-2026-07-15 --profile minimal
          rustup target add --toolchain nightly-2026-07-15 aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - name: Build Aegis libsignal libraries
        working-directory: native/aegis-crypto
        run: |
          cargo build --locked --release --target aarch64-apple-ios
          cargo build --locked --release --target aarch64-apple-ios-sim
          cargo build --locked --release --target x86_64-apple-ios
      - name: Package AegisCrypto XCFramework
        run: |
          mkdir -p build/ios include/AegisCrypto
          cp native/aegis-crypto/include/aegis_crypto.h include/AegisCrypto/
          printf 'framework module AegisCrypto {\n  header "aegis_crypto.h"\n  export *\n}\n' > include/AegisCrypto/module.modulemap
          lipo -create native/aegis-crypto/target/aarch64-apple-ios-sim/release/libaegis_crypto.a native/aegis-crypto/target/x86_64-apple-ios/release/libaegis_crypto.a -output build/ios/libaegis_crypto-simulator.a
          xcodebuild -create-xcframework -library native/aegis-crypto/target/aarch64-apple-ios/release/libaegis_crypto.a -headers include/AegisCrypto -library build/ios/libaegis_crypto-simulator.a -headers include/AegisCrypto -output build/ios/AegisCrypto.xcframework
          ditto -c -k --sequesterRsrc --keepParent build/ios/AegisCrypto.xcframework build/ios/AegisCrypto.xcframework.zip
          shasum -a 256 build/ios/AegisCrypto.xcframework.zip > build/ios/AegisCrypto.xcframework.zip.sha256
      - name: Upload iOS framework
        uses: actions/upload-artifact@v4
        with:
          name: aegis-libsignal-ios-xcframework
          path: |
            build/ios/AegisCrypto.xcframework.zip
            build/ios/AegisCrypto.xcframework.zip.sha256
            native/aegis-crypto/bindings/ios/AegisCryptoNative.swift
          if-no-files-found: error
          retention-days: 14
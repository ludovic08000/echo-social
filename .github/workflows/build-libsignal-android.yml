name: Build libsignal Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-libsignal-android.yml

permissions:
  contents: read

jobs:
  build-aarch64:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out Echo Social
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Android platform and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "ndk;28.0.13004108"

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install nightly-2026-07-15 --profile minimal
          rustup target add aarch64-linux-android --toolchain nightly-2026-07-15

      - name: Check out pinned libsignal
        shell: bash
        run: |
          git clone https://github.com/signalapp/libsignal.git libsignal
          git -C libsignal checkout 857c4dca03537dc5e395a5e1eda6bf18f59c3601

      - name: Build Android AAR
        working-directory: libsignal/java
        env:
          CARGO_BUILD_JOBS: "2"
          RUSTUP_TOOLCHAIN: nightly-2026-07-15
        run: ./gradlew :android:assembleRelease -PandroidArchs=aarch64 --no-daemon --max-workers=2 --console=plain

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          find libsignal/java/android/build/outputs/aar -type f -name '*.aar' -exec cp {} artifacts/ \;
          find libsignal/java/client/build/libs -type f -name '*.jar' -exec cp {} artifacts/ \;
          find libsignal/java/android/src/main/jniLibs -type f -name '*.so' -exec cp --parents {} artifacts/ \;

      - name: Upload libsignal Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libsignal-android-aarch64-857c4dca
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

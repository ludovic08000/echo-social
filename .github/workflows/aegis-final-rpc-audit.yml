name: Aegis final RPC diagnostic

on:
  push:
    branches:
      - agent/aegis-ui-rpc-logic-fix

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aegis-ui-rpc-logic-fix
          fetch-depth: 0

      - name: Produce deterministic compatibility report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          fanout = Path('src/lib/messaging/multiDeviceFanout.ts')
          source = fanout.read_text()
          old = """  const rpcResult = await supabase.rpc('get_device_copy_for_message', {
              p_message_id: messageId,
              p_device_id: deviceId,
            });"""
          new = """  const rpcResult = await supabase.rpc('get_device_copies_for_messages', {
              p_message_ids: [messageId],
              p_device_id: deviceId,
            });"""
          replacement_count = source.count(old)
          patched = source.replace(old, new)
          fanout.write_text(patched)

          excluded = {
              Path('src/integrations/supabase/types.ts'),
          }
          runtime_files = []
          for path in Path('src').rglob('*'):
              if not path.is_file() or path.suffix not in {'.ts', '.tsx'}:
                  continue
              if '__tests__' in path.parts or path in excluded:
                  continue
              runtime_files.append(path)

          forbidden = [
              "'aegis_sync_device'",
              "'aegis_ack_device_messages'",
              "'get_device_copy_for_message'",
              "'send_message_with_device_copies'",
              "'insert_message_with_device_copies'",
              "'call_signal'",
          ]

          report = []
          report.append(f'replacement_count={replacement_count}')
          report.append(f'runtime_file_count={len(runtime_files)}')
          report.append('')
          report.append('[forbidden runtime matches]')
          total_matches = 0
          for needle in forbidden:
              matches = []
              for path in runtime_files:
                  text = path.read_text(errors='replace')
                  for line_no, line in enumerate(text.splitlines(), 1):
                      if needle in line:
                          matches.append(f'{path}:{line_no}:{line.strip()}')
              total_matches += len(matches)
              report.append(f'{needle}: {len(matches)}')
              report.extend(f'  {match}' for match in matches)
          report.append(f'total_forbidden_matches={total_matches}')

          chat = Path('src/components/ChatWidget.tsx').read_text()
          hooks = Path('src/hooks/useMessages.ts').read_text()
          start = hooks.find('export function useConversations()')
          end = hooks.find('export function useMessages(')
          conversation = hooks[start:end] if start >= 0 and end > start else ''

          checks = {
              'pending_empty_condition': '(messages?.length ?? 0) === 0 && queue.pendingMessages.length === 0' in chat,
              'pending_bubble_right': 'key={pm.localId} className="flex justify-end mt-1 px-2"' in chat,
              'stable_mark_read_destructure': 'const { mutate: markConversationRead } = useMarkConversationRead();' in chat,
              'stable_mark_read_dependency': '[conversationId, markConversationRead]' in chat,
              'old_mark_read_dependency_absent': '[conversationId, markRead]' not in chat,
              'use_conversations_found': start >= 0,
              'use_messages_found_after': end > start >= 0,
              'scoped_conversation_key': "queryKey: ['conversations', user?.id ?? 'anon']" in conversation,
              'restored_scoped_key': "queryKey: ['conversations', userId]" in hooks,
              'refetch_mount_false': 'refetchOnMount: false' in conversation,
              'refetch_mount_always_absent': "refetchOnMount: 'always'" not in conversation,
              'batch_rpc_after_patch': "'get_device_copies_for_messages'" in patched,
              'singular_rpc_after_patch_absent': "'get_device_copy_for_message'" not in patched,
          }
          report.append('')
          report.append('[ui and RPC checks]')
          for name, value in checks.items():
              report.append(f'{name}={value}')

          report_path = Path('.github/aegis-final-rpc-diagnostic.txt')
          report_path.write_text('\n'.join(report) + '\n')
          print(report_path.read_text())
          PY

      - name: Commit diagnostic report only
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/aegis-final-rpc-diagnostic.txt
          git commit -m "chore(aegis): record final RPC diagnostic"
          git push origin HEAD:agent/aegis-ui-rpc-logic-fix

name: Aegis step 4 direct finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Fetch and verify exact stage 4 blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          fetch_blob() {
            local blob="$1" path="$2" expected="$3"
            mkdir -p "$(dirname "$path")"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/git/blobs/$blob" \
              | jq -r '.content' | tr -d '\n' | base64 --decode > "$path"
            echo "$expected  $path" | sha256sum --check
          }

          fetch_blob a72c02f03ac48b3a8c794e4e1b5794d372952270 docs/AEGIS_CLEAN_REBUILD.md a8a9f7f56ce764c971b061de4821ed62679e92322550cc1b137aa49810ab1751
          fetch_blob 50cece7fde944285c820b9f2592fa1d5a8ede015 docs/AEGIS_E2EE_ARCHITECTURE.md ee4ace3fa517f73faa62edb1e9f6217b81245886369635aea93a90e15ab9706d
          fetch_blob de5d7be5bebd221a65d0b85a281bf5226280a8a3 src/hooks/useAegisMessageQueue.ts a9fc0e4f8a0c60e35a122e4bbf39e78142b9f4e783d51a217d4e8432bb8c14ea
          fetch_blob c5c4335e5f886213b5a8dce9c0a283ec06fc773f src/lib/messaging/aegisOutboundEngine.ts fe256a1c2ec8350df2d416f23d3d674239d32fdbba91885c311bc63f50e0c309
          fetch_blob 0b325da3bd55a028beae7fe73f5a42b717c34581 src/lib/messaging/aegisConversationQueue.ts bee99a9b99fa7618a7b60428e4c93684857ad4f1ad4ac06c9d750dd0c65449ca
          fetch_blob 35235c27c32f22ab512a29a6c42c5a43819127d0 src/lib/messaging/outboxVault.ts 3f184f6247b1741f104e3faf8d678713e50251444f84343e09122c3102744205
          fetch_blob d3400f33a6434fbaceaf91f9502ccf1bd391c1fa src/lib/crypto/deviceSessionQueue.ts df48202da0751098800501d89e23e9fe266d01dade915b086a069169f299c971
          fetch_blob cf67713bea1a163ddf33f51f26d82a98b6c829e1 src/lib/crypto/deviceIdentity.ts 3feeddbcdea0a8439bd9e5977cd0b688dbddb834d8871d1c951bd24aa03a73c5
          fetch_blob 6cdbbd6a32d4d07ec782a9d37bf2eb815f4673a1 src/lib/crypto/crossTabLock.ts 6cd507da7648745eab4058dfbb0082a9368d586139eb83a8109ad98d09249cd2
          fetch_blob 9820f509951f32c944c47a1e03fd444310947462 src/lib/crypto/deviceKx.ts 83017dff89c742987ad0a4f1f864d9e7efb4edabc6d006e731a47f33be82f268
          fetch_blob f89b9feefe685327ae32ff6cfed991fd92f0f62a src/lib/crypto/dbRegistry.ts a6d55d5ca8918685f2ed1d69ab16a00f0786447cd82f6bf38f2469143dbb492a
          fetch_blob df0fa7827fa493a174aa69aec404faf3493e5987 src/lib/crypto/__tests__/crossTabLock.test.ts acb6be4e45224c35a9ef7a49571b262f491142389a2b03a29e0ad060de13015d
          fetch_blob 26072f53f6272991057370852197f908bd71b403 src/lib/messaging/__tests__/aegisConversationQueue.test.ts f0f00f3c36b8872804279e9d3bfaf1e4421ffc00e15e09e42bfdcf3623fed0a6
          fetch_blob e75e569e1ca6f5d5f82eea349bede06888e63b6f src/lib/messaging/__tests__/aegisOutboxAuthoritativeReceiptPolicy.test.ts 4c2d495a4a0434ce579607b71df0546555eef184031aa734bfe6668fa5f8da57
          fetch_blob cdc8670399f66c34f2bd65605a8a262bb3de9878 src/lib/messaging/__tests__/outboxVault.test.ts 01ba071afaa3f2b67e5ec58e6fca89ad7cbc6aa5d69abf9ecf361ff5324babaa

      - name: Validate patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
            'docs/AEGIS_CLEAN_REBUILD.md', 'docs/AEGIS_E2EE_ARCHITECTURE.md',
            'src/hooks/useAegisMessageQueue.ts',
            'src/lib/messaging/aegisOutboundEngine.ts',
            'src/lib/messaging/aegisConversationQueue.ts',
            'src/lib/messaging/outboxVault.ts',
            'src/lib/crypto/deviceSessionQueue.ts',
            'src/lib/crypto/deviceIdentity.ts',
            'src/lib/crypto/crossTabLock.ts',
            'src/lib/crypto/deviceKx.ts',
            'src/lib/crypto/dbRegistry.ts',
            'src/lib/crypto/__tests__/crossTabLock.test.ts',
            'src/lib/messaging/__tests__/aegisConversationQueue.test.ts',
            'src/lib/messaging/__tests__/aegisOutboxAuthoritativeReceiptPolicy.test.ts',
            'src/lib/messaging/__tests__/outboxVault.test.ts',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if changed != expected:
            raise SystemExit(f'patch scope mismatch: missing={sorted(expected-changed)} extra={sorted(changed-expected)}')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Targeted stage 4 tests
        run: >-
          npx vitest run
          src/lib/crypto/__tests__/crossTabLock.test.ts
          src/lib/messaging/__tests__/outboxVault.test.ts
          src/lib/messaging/__tests__/aegisConversationQueue.test.ts
          src/lib/messaging/__tests__/aegisOutboxAuthoritativeReceiptPolicy.test.ts

      - name: Typecheck
        run: npm run typecheck
      - name: Legacy repository lint
        continue-on-error: true
        run: npm run lint
      - name: Full test suite
        run: npm run test
      - name: Production build
        run: npm run build

      - name: Commit validated stage 4
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .aegis-stage4-parts
          rm -f .github/workflows/aegis-step4-implement.yml
          rm -f .github/workflows/aegis-step4-finalize.yml
          rm -f .github/workflows/aegis-tree-sha.yml
          rm -f .github/workflows/aegis-step4-blob-finalize.yml
          rm -f .github/workflows/aegis-step4-direct-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'feat(aegis): add durable cross-tab encrypted outbox'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

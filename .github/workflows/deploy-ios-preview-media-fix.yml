name: Deploy iOS Preview Media Fix

on:
  workflow_dispatch:
  push:
    branches:
      - fix/ios-pin-device-enrollment
    paths:
      - scripts/patch-ios-preview-media.py
      - .github/workflows/deploy-ios-preview-media-fix.yml

permissions:
  contents: write

concurrency:
  group: deploy-ios-preview-media-fix
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: vkpmoqfzrihcijjochks
      PREVIEW_ORIGIN: https://echo-social-git-fix-ios-pin-d-e70524-ludovics-projects-92893680.vercel.app

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/ios-pin-device-enrollment
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply source fixes
        run: python scripts/patch-ios-preview-media.py

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/r2.ts src/components/PinValidatedMessaging.tsx supabase/functions/r2-presign/index.ts supabase/functions/r2-upload/index.ts
          if git diff --cached --quiet; then
            echo "Sources already patched"
          else
            git commit -m "fix(ios): repair Preview media upload and enrollment diagnostics"
            git push origin HEAD:fix/ios-pin-device-enrollment
          fi

      - name: Verify deployment credential
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy R2 Edge Functions
        run: |
          supabase functions deploy r2-presign --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy r2-upload --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Verify Preview CORS
        run: |
          for function_name in r2-presign r2-upload; do
            endpoint="https://${PROJECT_REF}.supabase.co/functions/v1/${function_name}"
            headers="$(mktemp)"
            curl --silent --show-error --output /dev/null --dump-header "$headers" \
              --request OPTIONS "$endpoint" \
              --header "Origin: ${PREVIEW_ORIGIN}" \
              --header "Access-Control-Request-Method: POST" \
              --header "Access-Control-Request-Headers: authorization,apikey,content-type"
            tr -d '\r' < "$headers"
            grep -Fqi "access-control-allow-origin: ${PREVIEW_ORIGIN}" "$headers"
          done

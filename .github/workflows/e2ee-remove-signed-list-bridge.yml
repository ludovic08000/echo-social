name: Remove Signed Device List Bridge

on:
  push:
    branches:
      - 'fix/device-lifecycle-signal-order'

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/device-lifecycle-signal-order
      - name: Replace final legacy import and remove bridge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/crypto/x3dh.ts')
          s = p.read_text()
          old = "import { fetchVerifiedDeviceIdentity } from './signedDeviceList';"
          new = "import { fetchVerifiedDeviceIdentity } from './canonicalDeviceRegistry';"
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one signedDeviceList import in x3dh.ts, found {count}')
          p.write_text(s.replace(old, new))
          bridge = Path('src/lib/crypto/signedDeviceList.ts')
          if not bridge.exists():
              raise SystemExit('bridge file already absent; refusing unexpected state')
          bridge.unlink()
          PY
          git diff --check
          test "$(git diff --name-only | sort)" = $'src/lib/crypto/signedDeviceList.ts\nsrc/lib/crypto/x3dh.ts'
      - name: Verify typecheck before commit
        run: |
          npm ci
          npm run typecheck
      - name: Commit canonicalization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/crypto/x3dh.ts src/lib/crypto/signedDeviceList.ts
          git commit -m 'refactor(e2ee): remove signed device list bridge'
          git push origin HEAD:fix/device-lifecycle-signal-order

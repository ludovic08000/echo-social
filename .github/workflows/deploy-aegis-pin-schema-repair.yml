name: Deploy Aegis PIN schema repair

on:
  push:
    branches:
      - main
    paths:
      - supabase/migrations/20260729103000_repair_aegis_pin_backup.sql
      - .github/workflows/deploy-aegis-pin-schema-repair.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-aegis-pin-schema-repair
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PROJECT_REF: vkpmoqfzrihcijjochks
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MIGRATION_FILE: supabase/migrations/20260729103000_repair_aegis_pin_backup.sql

    steps:
      - uses: actions/checkout@v4

      - name: Require Supabase management token
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi

      - name: Apply PIN schema repair
        shell: bash
        run: |
          jq -Rs '{query: ., read_only: false}' "$MIGRATION_FILE" > "$RUNNER_TEMP/migration-request.json"
          status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/migration-response.json" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/migration-request.json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query")"

          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "Supabase PIN migration failed with HTTP $status" >&2
            jq . "$RUNNER_TEMP/migration-response.json" >&2 || true
            exit 1
          fi

      - name: Verify PIN table, policies and RPCs
        shell: bash
        run: |
          verification_sql="select
            to_regclass('public.backup_pin_state') is not null as table_ready,
            to_regprocedure('public.has_backup_pin(uuid)') is not null as has_rpc_ready,
            to_regprocedure('public.release_backup_pin_blob(uuid)') is not null as release_rpc_ready,
            exists (
              select 1 from pg_policies
              where schemaname = 'public'
                and tablename = 'backup_pin_state'
                and policyname = 'User upserts own backup pin state'
            ) as insert_policy_ready,
            exists (
              select 1 from pg_policies
              where schemaname = 'public'
                and tablename = 'backup_pin_state'
                and policyname = 'User updates own backup pin state'
            ) as update_policy_ready;"

          jq -n --arg query "$verification_sql" \
            '{query: $query, read_only: true}' > "$RUNNER_TEMP/verification-request.json"

          status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/verification-response.json" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/verification-request.json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query")"

          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "Supabase PIN verification failed with HTTP $status" >&2
            jq . "$RUNNER_TEMP/verification-response.json" >&2 || true
            exit 1
          fi

          jq -e '
            .. | objects |
            select(
              .table_ready == true
              and .has_rpc_ready == true
              and .release_rpc_ready == true
              and .insert_policy_ready == true
              and .update_policy_ready == true
            )
          ' "$RUNNER_TEMP/verification-response.json" > /dev/null

      - name: Publish Supabase migration status
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIGRATION_JOB_STATUS: ${{ job.status }}
        run: |
          case "$MIGRATION_JOB_STATUS" in
            success)
              state="success"
              description="Aegis PIN schema applied and verified"
              ;;
            failure)
              state="failure"
              description="Aegis PIN schema migration or verification failed"
              ;;
            *)
              state="error"
              description="Aegis PIN schema workflow did not complete"
              ;;
          esac

          jq -n \
            --arg state "$state" \
            --arg context "Supabase/Aegis PIN schema" \
            --arg description "$description" \
            --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}' \
            > "$RUNNER_TEMP/status.json"

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$RUNNER_TEMP/status.json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" > /dev/null

name: Aegis step 4 docs finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Finalize validated checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/AEGIS_CLEAN_REBUILD.md')
          text = path.read_text()
          replacements = {
            '4. ⏳ Cross-tab locking and durable encrypted outbox — implementation complete, validation pending.':
              '4. ✅ Cross-tab locking and durable encrypted outbox.',
            '- Stages 1, 2 and 3 are complete and validated.':
              '- Stages 1, 2, 3 and 4 are complete and validated.',
            '- Stage 4 implementation is complete locally and awaiting exact-head CI validation.':
              '- Typecheck, targeted protocol tests, the full test suite, the production build and the Crypto Test Suite passed for stage 4.',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'missing expected checkpoint text: {old}')
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- docs/AEGIS_CLEAN_REBUILD.md

      - name: Commit final checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/aegis-step4-docs-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/AEGIS_CLEAN_REBUILD.md .github/workflows/aegis-step4-docs-finalize.yml
          git diff --cached --check
          git commit -m 'docs(aegis): mark stage 4 validated'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

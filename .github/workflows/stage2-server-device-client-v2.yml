name: Stage 2 Server Device Enrollment Client v2

on:
  push:
    branches:
      - fix/ios-pin-device-enrollment
    paths:
      - .github/workflows/stage2-server-device-client-v2.yml

permissions:
  contents: write

concurrency:
  group: stage2-server-device-enrollment-client-v2
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/ios-pin-device-enrollment
          fetch-depth: 0

      - name: Apply incremental client patch
        run: python scripts/stage2-server-device-client.py

      - name: Assert server-assigned enrollment wiring
        shell: bash
        run: |
          grep -n "beginServerAssignedDeviceEnrollment" src/lib/crypto/resyncE2EE.ts
          grep -n "completeServerAssignedDeviceEnrollment" src/lib/crypto/resyncE2EE.ts
          grep -n "setCurrentDeviceId(completedDeviceId)" src/lib/crypto/resyncE2EE.ts
          grep -n "E2EE_DEVICE_ID_SERVER_ASSIGNED" src/components/PinValidatedMessaging.tsx
          ! grep -n "adoptDeviceIdFromBackup(data" src/lib/crypto/accountKeyBackup.ts

      - name: Install dependencies
        run: npm ci

      - name: Run staged enrollment tests
        run: npx vitest run src/lib/crypto/__tests__/deviceBackupPolicy.test.ts src/lib/crypto/__tests__/serverDeviceEnrollment.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Commit stage 2 client
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/crypto/resyncE2EE.ts \
            src/components/PinValidatedMessaging.tsx \
            src/lib/messaging/currentDevice.ts
          git commit -m "feat(e2ee): enroll missing devices with server-assigned ids"
          git push origin HEAD:fix/ios-pin-device-enrollment

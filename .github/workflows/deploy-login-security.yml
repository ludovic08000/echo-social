name: Deploy login security

on:
  push:
    branches: [main]
    paths:
      - supabase/functions/login-security/**
      - supabase/functions/_shared/**
      - .github/workflows/deploy-login-security.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-login-security
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: vkpmoqfzrihcijjochks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          }

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Typecheck function
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno check --no-config supabase/functions/login-security/index.ts

      - name: Deploy login-security
        run: supabase functions deploy login-security --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Verify unauthenticated rejection
        shell: bash
        run: |
          endpoint="https://${PROJECT_REF}.supabase.co/functions/v1/login-security"
          status=$(curl --silent --show-error --output /tmp/login-security-response.json --write-out "%{http_code}" \
            --request POST "$endpoint" \
            --header "Content-Type: application/json" \
            --data '{"action":"assess"}')
          cat /tmp/login-security-response.json
          if [ "$status" != "401" ]; then
            echo "Expected HTTP 401, received $status" >&2
            exit 1
          fi

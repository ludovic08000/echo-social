name: PR53 deep recovery audit fixes

on:
  push:
    branches:
      - agent/aegis-pin-recovery-continuity-fix
    paths:
      - .github/workflows/pr53-deep-audit-fixes.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aegis-pin-recovery-continuity-fix
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply fail-closed recovery fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, text: str) -> None:
              Path(path).write_text(text)

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, found {count}')
              write(path, text.replace(old, new, 1))

          def replace_regex(path: str, pattern: str, replacement: str) -> None:
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: regex replacement expected one match, found {count}')
              write(path, updated)

          # 1. A missing/failed continuity inspection must never create a new identity.
          replace_once(
              'src/lib/crypto/keyManager.ts',
              """    const [{ data: activeKey }, { data: backup }] = await Promise.all([\n      supabase.from('user_public_keys').select('fingerprint').eq('user_id', userId).eq('is_active', true).maybeSingle(),\n      supabase.from('user_backups').select('id').eq('user_id', userId).limit(1).maybeSingle(),\n    ]);\n\n    if (activeKey || backup) {\n      throw new PinUnlockRequiredError(\n        'PIN_UNLOCK_REQUIRED: server identity continuity detected — restore via PIN / recovery key / passkey before generating a new identity.',\n      );\n    }\n""",
              """    const [pinResult, identityResult, backupResult] = await Promise.all([\n      supabase.rpc('has_backup_pin' as never, { _user_id: userId } as never),\n      supabase.from('user_public_keys').select('fingerprint').eq('user_id', userId).eq('is_active', true).maybeSingle(),\n      supabase.from('user_backups').select('id').eq('user_id', userId).limit(1).maybeSingle(),\n    ]);\n\n    if (pinResult.error || identityResult.error || backupResult.error) {\n      throw new Error('E2EE_CONTINUITY_INSPECTION_UNAVAILABLE');\n    }\n\n    if (pinResult.data === true || identityResult.data || backupResult.data) {\n      throw new PinUnlockRequiredError(\n        'PIN_UNLOCK_REQUIRED: server identity continuity detected — restore via PIN / recovery key / passkey before generating a new identity.',\n      );\n    }\n""",
          )

          # 2. Master Key initialization is account-scoped, single-flight and server-first.
          replace_once(
              'src/lib/crypto/accountKeyBackup.ts',
              """let _sessionUserId: string | null = null;\n""",
              """let _sessionUserId: string | null = null;\n\ntype AccountKeyInitResult = 'restored' | 'local_ok' | 'no_backup' | 'error';\nconst accountKeyInitFlights = new Map<string, Promise<AccountKeyInitResult>>();\n""",
          )

          replace_once(
              'src/lib/crypto/accountKeyBackup.ts',
              """function generateMasterKey(): Uint8Array {\n  return hardCrypto.getRandomValues(new Uint8Array(MASTER_KEY_LENGTH));\n}\n""",
              """function generateMasterKey(): Uint8Array {\n  return hardCrypto.getRandomValues(new Uint8Array(MASTER_KEY_LENGTH));\n}\n\nasync function hasLocalAccountIdentity(userId: string): Promise<boolean> {\n  const { loadIdentityKeys } = await import('./keyManager');\n  return Boolean(await loadIdentityKeys(userId));\n}\n\nasync function loadAccountMasterKeyOnly(\n  password: string,\n  userId: string,\n): Promise<{ masterKeyRaw: Uint8Array; masterKey: CryptoKey } | null> {\n  const { data, error } = await supabase\n    .from('user_backups' as any)\n    .select('encrypted_blob, iv, salt, wrapped_master_key, master_key_iv, version, backup_type')\n    .eq('user_id', userId)\n    .eq('backup_type', 'account')\n    .maybeSingle();\n  if (error) throw error;\n  if (!data) return null;\n\n  const backup = data as unknown as BackupRow;\n  const secret = passwordSecret(password, userId);\n  if (backup.version < 5 || !backup.wrapped_master_key || !backup.master_key_iv) {\n    return downloadAndRestore(userId, 'account', secret);\n  }\n\n  const salt = new Uint8Array(base64ToBuffer(backup.salt));\n  const wrappingKey = await deriveWrappingKey(secret, salt);\n  const aad = backup.version >= 6 ? buildBackupAAD(userId, 'account', backup.version) : undefined;\n  const masterKeyRaw = await unwrapMasterKey(\n    backup.wrapped_master_key,\n    backup.master_key_iv,\n    wrappingKey,\n    aad,\n  );\n  return { masterKeyRaw, masterKey: await importMasterKey(masterKeyRaw) };\n}\n""",
          )

          replace_once(
              'src/lib/crypto/accountKeyBackup.ts',
              """  const { data } = await supabase\n    .from('user_backups' as any)\n    .select('encrypted_blob, iv, salt, wrapped_master_key, master_key_iv, version, backup_type')\n    .eq('user_id', userId)\n    .eq('backup_type', backupType)\n    .maybeSingle();\n\n  if (!data) return null;\n""",
              """  const { data, error } = await supabase\n    .from('user_backups' as any)\n    .select('encrypted_blob, iv, salt, wrapped_master_key, master_key_iv, version, backup_type')\n    .eq('user_id', userId)\n    .eq('backup_type', backupType)\n    .maybeSingle();\n\n  if (error) throw error;\n  if (!data) return null;\n""",
          )

          new_init = r'''export async function initAccountKeySync(password: string, userId: string): Promise<AccountKeyInitResult> {
  const existingFlight = accountKeyInitFlights.get(userId);
  if (existingFlight) return existingFlight;

  const flight = (async (): Promise<AccountKeyInitResult> => {
    const t0 = performance.now();
    try {
      _sessionPassword = password;
      _sessionUserId = userId;
      const secret = passwordSecret(password, userId);
      let localIdentityPresent = await hasLocalAccountIdentity(userId);

      // Server-first: an existing account backup is the authority for the
      // Master Key. Load it before considering any creation, even when the
      // account identity is already present locally.
      const existingMaster = await loadAccountMasterKeyOnly(password, userId);
      if (existingMaster) {
        _sessionRawMasterKey = existingMaster.masterKeyRaw;
        _sessionMasterKey = existingMaster.masterKey;
        dispatchSessionUnlocked(userId);

        // Legacy backup migration may already have restored the identity.
        if (!localIdentityPresent) {
          localIdentityPresent = await hasLocalAccountIdentity(userId);
        }
        if (localIdentityPresent) {
          logCryptoError({
            severity: 'info', context: 'backup', errorCode: 'BACKUP_INIT_EXISTING_MASTER_KEY',
            errorMessage: 'Existing account Master Key loaded without rotation',
            metadata: { userId, durationMs: Math.round(performance.now() - t0) },
          });
          return 'local_ok';
        }

        const restored = await downloadAndRestore(userId, 'account', secret);
        if (!restored || !(await hasLocalAccountIdentity(userId))) {
          throw new Error('RESTORE_VALIDATION_FAILED');
        }
        _sessionRawMasterKey = restored.masterKeyRaw;
        _sessionMasterKey = restored.masterKey;
        dispatchSessionUnlocked(userId);
        await writeKeychainSnapshot(userId);
        void runPostRestoreSync(userId, 'password_active_session');
        return 'restored';
      }

      if (!localIdentityPresent) {
        logCryptoError({
          severity: 'warning', context: 'restore', errorCode: 'RESTORE_NO_BACKUP',
          errorMessage: 'No account backup or local account identity found',
          metadata: { userId },
        });
        return 'no_backup';
      }

      // A genuinely local-only account gets exactly one Master Key. The
      // account-scoped single-flight above prevents concurrent PIN/login paths
      // from creating competing keys.
      const masterKeyRaw = generateMasterKey();
      const masterKey = await importMasterKey(masterKeyRaw);
      _sessionRawMasterKey = masterKeyRaw;
      _sessionMasterKey = masterKey;
      dispatchSessionUnlocked(userId);
      const uploaded = await uploadBackup(
        masterKeyRaw,
        masterKey,
        password,
        userId,
        'account',
        secret,
      );
      if (!uploaded) throw new Error('ACCOUNT_BACKUP_INITIAL_UPLOAD_FAILED');
      return 'local_ok';
    } catch (err) {
      console.error('[MasterKey] Init failed:', err);
      logCryptoException('backup', err, {
        severity: 'critical',
        metadata: { stage: 'init', userId, durationMs: Math.round(performance.now() - t0) },
      });
      return 'error';
    }
  })().finally(() => {
    accountKeyInitFlights.delete(userId);
  });

  accountKeyInitFlights.set(userId, flight);
  return flight;
}'''
          replace_regex(
              'src/lib/crypto/accountKeyBackup.ts',
              r"export async function initAccountKeySync\(password: string, userId: string\): Promise<'restored' \| 'local_ok' \| 'no_backup' \| 'error'> \{.*?\n\}\n\n(?=/\*\*\n \* Re-attempt restore)",
              new_init + "\n\n",
          )

          # The restore gate must check the actual account identity, not any
          # unrelated ratchet/PIN/device row in IndexedDB.
          replace_once(
              'src/lib/crypto/accountKeyBackup.ts',
              """    const hasLocal = await hasLocalKeys();\n    if (hasLocal) {\n      console.log('[MasterKey] Active-session restore skipped: local crypto already present');\n      return 'local_ok';\n    }\n""",
              """    const hasLocal = targetUserId\n      ? await hasLocalAccountIdentity(targetUserId)\n      : false;\n    if (hasLocal) {\n      console.log('[MasterKey] Active-session restore skipped: account identity already present');\n      return 'local_ok';\n    }\n""",
          )
          replace_once(
              'src/lib/crypto/accountKeyBackup.ts',
              """    if (await hasLocalKeys()) return 'local_ok';\n    if (!_sessionMasterKey || !targetUserId) return 'unavailable';\n""",
              """    if (targetUserId && await hasLocalAccountIdentity(targetUserId)) return 'local_ok';\n    if (!_sessionMasterKey || !targetUserId || _sessionUserId !== targetUserId) return 'unavailable';\n""",
          )
          replace_once(
              'src/lib/crypto/accountKeyBackup.ts',
              """    if (!(await hasLocalKeys())) return 'error';\n""",
              """    if (!(await hasLocalAccountIdentity(targetUserId))) return 'error';\n""",
          )

          new_sync = r'''export async function syncBackupToServer(): Promise<boolean> {
  if (
    !_sessionPassword ||
    !_sessionUserId ||
    !_sessionRawMasterKey ||
    !_sessionMasterKey
  ) {
    // Synchronization may persist only the authoritative key established by
    // initAccountKeySync/restore. It must never create a second Master Key.
    return false;
  }

  try {
    const secret = passwordSecret(_sessionPassword, _sessionUserId);
    const ok = await uploadBackup(
      _sessionRawMasterKey,
      _sessionMasterKey,
      _sessionPassword,
      _sessionUserId,
      'account',
      secret,
    );
    if (ok) {
      console.log('[MasterKey] ✅ Backup synced');
      logCryptoError({
        severity: 'info', context: 'backup', errorCode: 'BACKUP_SYNCED',
        errorMessage: 'Master Key backup synced to server',
        metadata: { userId: _sessionUserId },
      });
    }
    return ok;
  } catch (err) {
    console.warn('[MasterKey] Sync failed:', err);
    logCryptoException('backup', err, { severity: 'error', metadata: { stage: 'sync', userId: _sessionUserId } });
    return false;
  }
}'''
          replace_regex(
              'src/lib/crypto/accountKeyBackup.ts',
              r"export async function syncBackupToServer\(\): Promise<boolean> \{.*?\n\}\n\n(?=/\*\* Check if auto-backup session is active)",
              new_sync + "\n\n",
          )
          replace_once(
              'src/lib/crypto/accountKeyBackup.ts',
              """export function isAutoBackupActive(): boolean {\n  return _sessionPassword !== null && _sessionUserId !== null;\n}\n""",
              """export function isAutoBackupActive(): boolean {\n  return Boolean(\n    _sessionPassword &&\n    _sessionUserId &&\n    _sessionRawMasterKey &&\n    _sessionMasterKey\n  );\n}\n""",
          )
          replace_once(
              'src/lib/crypto/accountKeyBackup.ts',
              """export function getSessionUserId(): string | null {\n  return _sessionUserId;\n}\n""",
              """export function getSessionUserId(): string | null {\n  return _sessionUserId;\n}\n\nexport function isAccountMasterKeyReady(userId: string): boolean {\n  return Boolean(\n    userId &&\n    _sessionUserId === userId &&\n    _sessionRawMasterKey &&\n    _sessionMasterKey\n  );\n}\n""",
          )

          # 3. PIN wrapping waits for the authoritative account Master Key and
          # never calls a synchronization function that can race initialization.
          replace_once(
              'src/lib/crypto/aegisPinBackup.ts',
              """import { setupBackupPin, syncBackupToServer } from '@/lib/crypto/accountKeyBackup';\n""",
              """import {\n  isAccountMasterKeyReady,\n  setupBackupPin,\n} from '@/lib/crypto/accountKeyBackup';\n""",
          )
          replace_regex(
              'src/lib/crypto/aegisPinBackup.ts',
              r"async function setupFromAccountMasterKey\(pin: string, userId: string\): Promise<SetupPinResult> \{.*?\n\}\n\n(?=/\*\*)",
              r'''async function setupFromAccountMasterKey(pin: string, userId: string): Promise<SetupPinResult> {
  const delays = [0, 150, 350, 750, 1_500, 3_000];
  let result: SetupPinResult = 'no_master_key';

  for (const delay of delays) {
    if (delay > 0) await new Promise((resolve) => setTimeout(resolve, delay));
    if (!isAccountMasterKeyReady(userId)) continue;
    result = await setupBackupPin(pin, userId);
    if (result !== 'no_master_key') return result;
  }

  return result;
}

''',
          )

          # 4/5. No unlock before a recoverable server PIN exists. A partial
          # storage wipe restores the identity before emitting unlock events.
          new_setup = r'''  const setupPin = useCallback(async (pin: string): Promise<boolean> => {
    if (!user?.id) return false;
    if (!/^\d{6}$/.test(pin)) {
      setState((current) => ({ ...current, error: 'Le PIN doit contenir exactement 6 chiffres' }));
      return false;
    }
    setState((current) => ({ ...current, processing: true, error: null }));

    try {
      const safety = await inspectSetupSafety(user.id);
      if (!safety.allowed) {
        const error = safety.reason === 'server_pin_exists'
          ? 'Un PIN existe déjà pour ce compte. Entrez votre PIN existant.'
          : safety.reason === 'inspection_unavailable'
            ? 'Vérification de sécurité indisponible. Aucun nouveau PIN n’a été créé.'
            : 'Restaurez votre identité sécurisée existante avant de créer un nouveau PIN.';
        setState((current) => ({ ...current, processing: false, hasPin: true, error }));
        return false;
      }

      await saveLocalPin(user.id, pin);
      const backupResult = await setupPersistentBackupPin(pin, user.id);
      if (backupResult !== 'ok') {
        await removeLocalPin(user.id).catch(() => undefined);
        const error = backupResult === 'no_master_key'
          ? 'La clé de récupération du compte n’est pas encore disponible. Reconnectez-vous puis réessayez.'
          : 'Le PIN n’a pas pu être sauvegardé de façon récupérable. Aucun déverrouillage n’a été effectué.';
        setState((current) => ({
          ...current,
          processing: false,
          hasPin: false,
          unlocked: false,
          error,
        }));
        return false;
      }

      announceUnlock(user.id);
      pinModeRef.current = 'every_open';
      storageSet(localStorage, `${MODE_PREFIX}${user.id}`, 'every_open');
      setState({
        loaded: true,
        hasPin: true,
        unlocked: true,
        error: null,
        processing: false,
        pinMode: 'every_open',
      });

      void supabase.functions.invoke('verify-chat-pin', {
        body: { action: 'register-local-recovery' },
      }).catch(() => undefined);
      return true;
    } catch (error) {
      await removeLocalPin(user.id).catch(() => undefined);
      console.warn('[LOCAL-PIN] setup failed', error);
      setState((current) => ({
        ...current,
        processing: false,
        hasPin: false,
        unlocked: false,
        error: 'Stockage ou sauvegarde sécurisée indisponible',
      }));
      return false;
    }
  }, [user?.id]);'''
          replace_regex(
              'src/hooks/useChatPin.ts',
              r"  const setupPin = useCallback\(async \(pin: string\): Promise<boolean> => \{.*?\n  \}, \[user\?\.id\]\);",
              new_setup,
          )

          new_verify = r'''  const verifyPin = useCallback(async (pin: string): Promise<boolean> => {
    if (!user?.id) return false;
    if (!/^\d{6}$/.test(pin)) {
      setState((current) => ({ ...current, error: 'PIN invalide' }));
      return false;
    }
    setState((current) => ({ ...current, processing: true, error: null }));

    const localRecord = await loadLocalPin(user.id);
    if (localRecord) {
      const valid = await verifyLocalPin(user.id, pin);
      if (!valid) {
        setState((current) => ({ ...current, processing: false, error: 'PIN incorrect' }));
        return false;
      }

      // A verifier can survive a partial WebView/IndexedDB wipe while the
      // account identity is gone. Restore first; never emit an unlock event for
      // an empty identity store.
      const localIdentity = await loadIdentityKeys(user.id).catch(() => null);
      if (!localIdentity) {
        const restored = await restoreWithBackupPin(pin, user.id);
        if (restored.status !== 'restored') {
          const error = restored.status === 'locked'
            ? 'Trop de tentatives. Réessayez plus tard.'
            : restored.status === 'wrong_pin'
              ? 'PIN incorrect'
              : restored.status === 'no_backup'
                ? 'Aucune sauvegarde PIN utilisable. Reconnectez-vous avec votre mot de passe.'
                : 'Restauration de l’identité Aegis indisponible';
          setState((current) => ({ ...current, processing: false, unlocked: false, error }));
          return false;
        }
        const restoredIdentity = await loadIdentityKeys(user.id).catch(() => null);
        if (!restoredIdentity) {
          setState((current) => ({
            ...current,
            processing: false,
            unlocked: false,
            error: 'La restauration n’a pas rétabli l’identité sécurisée.',
          }));
          return false;
        }
      }

      announceUnlock(user.id);
      setState((current) => ({
        ...current,
        unlocked: true,
        processing: false,
        error: null,
      }));
      void setupPersistentBackupPin(pin, user.id).catch((error) => {
        console.warn('[LOCAL-PIN] background server backup verification failed', error);
      });
      return true;
    }

    const restored = await restoreWithBackupPin(pin, user.id);
    if (restored.status !== 'restored') {
      const error = restored.status === 'locked'
        ? 'Trop de tentatives. Réessayez plus tard.'
        : restored.status === 'wrong_pin'
          ? 'PIN incorrect'
          : restored.status === 'no_backup'
            ? 'Aucune sauvegarde PIN utilisable. Reconnectez-vous avec votre mot de passe pour restaurer l’identité.'
            : 'Sauvegarde PIN Aegis indisponible';
      setState((current) => ({ ...current, processing: false, error }));
      return false;
    }

    const restoredIdentity = await loadIdentityKeys(user.id).catch(() => null);
    if (!restoredIdentity) {
      setState((current) => ({
        ...current,
        processing: false,
        unlocked: false,
        error: 'La restauration n’a pas rétabli l’identité sécurisée.',
      }));
      return false;
    }
    await saveLocalPin(user.id, pin);
    announceUnlock(user.id);
    setState((current) => ({ ...current, hasPin: true, unlocked: true, processing: false, error: null }));
    return true;
  }, [user?.id]);'''
          replace_regex(
              'src/hooks/useChatPin.ts',
              r"  const verifyPin = useCallback\(async \(pin: string\): Promise<boolean> => \{.*?\n  \}, \[user\?\.id\]\);",
              new_verify,
          )

          # 6. Verification results carry route eligibility. Invalid current
          # routes block the whole fan-out; only explicitly non-routable history
          # may be quarantined.
          replace_once(
              'src/lib/crypto/signedDeviceList.ts',
              """export interface DeviceVerificationResult {\n  deviceId: string;\n  ok: boolean;\n""",
              """export interface DeviceVerificationResult {\n  deviceId: string;\n  ok: boolean;\n  isRoutable: boolean;\n""",
          )
          text = read('src/lib/crypto/signedDeviceList.ts')
          text = re.sub(
              r"deviceId: entry\.deviceId,\n(\s+)ok: false,",
              r"deviceId: entry.deviceId,\n\1ok: false,\n\1isRoutable: entry.isRoutable,",
              text,
          )
          text = text.replace(
              "return { deviceId: entry.deviceId, ok: false, reason: 'NO_DEVICE_AUTHORIZATION' };",
              "return { deviceId: entry.deviceId, ok: false, isRoutable: entry.isRoutable, reason: 'NO_DEVICE_AUTHORIZATION' };",
          )
          text = text.replace(
              "      ok,\n      reason: ok ? 'VALID' : 'BAD_DEVICE_AUTHORIZATION',",
              "      ok,\n      isRoutable: entry.isRoutable,\n      reason: ok ? 'VALID' : 'BAD_DEVICE_AUTHORIZATION',",
          )
          if text.count('isRoutable: entry.isRoutable') < 4:
              raise SystemExit('signedDeviceList.ts: route eligibility was not propagated to every verification path')
          write('src/lib/crypto/signedDeviceList.ts', text)

          replace_regex(
              'src/e2ee-session/deviceRegistry.ts',
              r"      const rejected = verified\.verifications\.filter\(\(entry\) => !entry\.ok\);.*?      return hygieneFilterDevices\(",
              r'''      const rejectedRoutable = verified.verifications.filter(
        (entry) => !entry.ok && entry.isRoutable !== false,
      );
      const quarantinedHistorical = verified.verifications.filter(
        (entry) => !entry.ok && entry.isRoutable === false,
      );
      const trustedRoutable = verified.trusted.filter(
        entry => entry.isRoutable && Boolean(entry.devicePublicKey),
      );

      if (quarantinedHistorical.length > 0 && typeof console !== 'undefined') {
        console.warn('[A1] quarantining invalid historical device authorizations', {
          userId: String(userId).slice(0, 8),
          quarantined: quarantinedHistorical.map((entry) => ({
            deviceId: String(entry.deviceId).slice(0, 8),
            reason: entry.reason ?? 'UNKNOWN',
          })),
        });
      }

      if (rejectedRoutable.length > 0) {
        throw new Error('E2EE_DEVICE_REGISTRY_INVALID');
      }
      if (trustedRoutable.length === 0) {
        throw new Error('E2EE_DEVICE_REGISTRY_INVALID');
      }

      return hygieneFilterDevices(''',
          )

          # 7. A forced peer-key refresh never falls back to stale cached keys.
          replace_once(
              'src/lib/crypto/peerKeyCache.ts',
              """  if (inflight) {\n    await inflight;\n    return _peerKeyCache.get(peerUserId)?.data ?? null;\n  }\n""",
              """  if (inflight) {\n    const refreshed = await inflight;\n    if (options?.forceRefresh && refreshed !== true) return null;\n    return _peerKeyCache.get(peerUserId)?.data ?? null;\n  }\n""",
          )
          replace_once(
              'src/lib/crypto/peerKeyCache.ts',
              """  _peerSyncPromise.set(inflightKey, p);\n  await p;\n  return _peerKeyCache.get(peerUserId)?.data ?? null;\n""",
              """  _peerSyncPromise.set(inflightKey, p);\n  const refreshed = await p;\n  if (options?.forceRefresh && refreshed !== true) return null;\n  return _peerKeyCache.get(peerUserId)?.data ?? null;\n""",
          )

          # Behavioral registry tests: only an explicitly non-routable invalid
          # row is historical; an invalid current route blocks sending.
          replace_once(
              'src/e2ee-session/__tests__/deviceRegistryFailClosed.test.ts',
              """    verifications: [{ deviceId, ok: true, reason: 'VALID' }],\n""",
              """    verifications: [{ deviceId, ok: true, isRoutable: true, reason: 'VALID' }],\n""",
          )
          replace_once(
              'src/e2ee-session/__tests__/deviceRegistryFailClosed.test.ts',
              """          { deviceId: 'peer-valid', ok: true, reason: 'VALID' },\n          { deviceId: 'peer-invalid', ok: false, reason: 'BAD_DEVICE_AUTHORIZATION' },\n""",
              """          { deviceId: 'peer-valid', ok: true, isRoutable: true, reason: 'VALID' },\n          { deviceId: 'peer-invalid', ok: false, isRoutable: false, reason: 'BAD_DEVICE_AUTHORIZATION' },\n""",
          )

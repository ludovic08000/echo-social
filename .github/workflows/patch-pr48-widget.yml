name: Patch PR48 widget

on:
  push:
    branches: [main]
    paths: [.github/workflows/patch-pr48-widget.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/server-message-transport
          fetch-depth: 0
      - run: python scripts/patch_pr48_widget.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ChatWidget.tsx src/hooks/useAegisMessageQueue.ts
          git commit -m "refactor(messages): remove E2EE readiness from new sends"
          git push origin HEAD:refactor/server-message-transport

name: Aegis step 7 hardening
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: aegis-step-7-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/aegis-step7-realtime-hardening.mjs
      - name: Verify hardening
        run: |
          grep -q "!isViewOnce && isMultiDeviceMessageRow" src/hooks/useMessages.ts
          grep -q "aegis_view_once_consumptions" src/hooks/useMessages.ts
          grep -q "alter publication supabase_realtime" supabase/migrations/20260730050000_aegis_view_once_consumption.sql
          grep -q "pendingOpened" src/lib/messaging/aegisViewOnce.ts
      - run: npx vitest run src/lib/messaging/__tests__/aegisViewOnceProtocol.test.ts
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Publish stage 7 hardening
        run: |
          rm scripts/aegis-step7-realtime-hardening.mjs .github/workflows/aegis-step7-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(aegis): harden realtime view-once consumption"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

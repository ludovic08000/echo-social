name: Aegis step 5 check
on:
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx vitest run src/lib/calls/__tests__/aegisCallProtocol.test.ts
      - run: npm run typecheck

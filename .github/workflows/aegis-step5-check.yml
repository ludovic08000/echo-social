name: Aegis step 5 check
on:
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify one active call-key path
        run: |
          matches=$(grep -R "callKeyEncrypt" -n src --exclude='callKeyEncrypt.ts' || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            exit 1
          fi
          ! grep -R 'call.startCall(conversationId' -n src
          ! grep -R 'roomName = `call-${conversationId}`' -n src
          ! grep -R 'encrypted_call_key: callKey' -n src
      - run: npx vitest run src/lib/calls/__tests__/aegisCallProtocol.test.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

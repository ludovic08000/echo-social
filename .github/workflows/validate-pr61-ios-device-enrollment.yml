name: Validate PR61 iOS Device Enrollment

on:
  push:
    branches:
      - fix/ios-pin-device-enrollment
    paths:
      - .github/workflows/validate-pr61-ios-device-enrollment.yml

permissions:
  contents: read

concurrency:
  group: validate-pr61-ios-device-enrollment
  cancel-in-progress: false

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/ios-pin-device-enrollment

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint new enrollment modules
        run: |
          npx eslint \
            src/lib/crypto/deviceBackupPolicy.ts \
            src/lib/crypto/__tests__/deviceBackupPolicy.test.ts \
            src/lib/crypto/serverDeviceEnrollment.ts \
            src/lib/crypto/__tests__/serverDeviceEnrollment.test.ts

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/ios-pin-device-enrollment

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax checks
        run: |
          node --check infra/aegis-server/server.mjs
          node --check infra/aegis-server/smoke-client.mjs
          node --check infra/aegis-server/vercel-adapter.mjs
          for file in api/aegis-*.mjs; do node --check "$file"; done

      - name: Gateway contract tests
        working-directory: infra/aegis-server
        run: npm test

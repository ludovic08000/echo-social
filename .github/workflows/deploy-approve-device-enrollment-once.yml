name: Deploy approve-device-enrollment once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-approve-device-enrollment-once.yml

permissions:
  contents: read

concurrency:
  group: deploy-approve-device-enrollment-once
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: vkpmoqfzrihcijjochks

    steps:
      - name: Checkout PR branch source
        uses: actions/checkout@v4
        with:
          ref: agent/force-ios-web-e2ee

      - name: Verify deployment credentials
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Function
        run: supabase functions deploy approve-device-enrollment --project-ref "$PROJECT_REF"

      - name: Verify unauthenticated rejection
        shell: bash
        run: |
          endpoint="https://${PROJECT_REF}.supabase.co/functions/v1/approve-device-enrollment"
          status=$(curl --silent --show-error --output /tmp/approve-response.json --write-out "%{http_code}" \
            --request POST "$endpoint" \
            --header "Content-Type: application/json" \
            --data '{"device_id":"dev_00000000000000000000000000000000"}')
          cat /tmp/approve-response.json
          if [ "$status" != "401" ]; then
            echo "Expected HTTP 401 without JWT, received $status" >&2
            exit 1
          fi

      - name: Show deployed function
        run: supabase functions list --project-ref "$PROJECT_REF"

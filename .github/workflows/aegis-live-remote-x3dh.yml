name: Aegis Remote X3DH Live

on:
  push:
    branches:
      - agent/aegis-durable-database
    paths:
      - 'src/lib/crypto/x3dhRatchetBootstrap.ts'
      - 'src/lib/crypto/__tests__/aegisLiveRemoteX3DH.test.ts'
      - 'supabase/migrations/20260805011500_aegis_x3dh_replay_ledger.sql'
      - '.github/workflows/aegis-live-remote-x3dh.yml'

permissions:
  contents: read

concurrency:
  group: aegis-remote-x3dh-live
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use the shared gateway core locally
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib/crypto/__tests__/aegisLiveRemoteX3DH.test.ts')
          source = path.read_text()
          source = source.replace(
              "import { describe, expect, it } from 'vitest';",
              "import { afterAll, beforeAll, describe, expect, it } from 'vitest';\nimport { once } from 'node:events';\nimport { createAegisServer, loadAegisConfig } from '../../../../infra/aegis-server/server.mjs';",
              1,
          )
          source = source.replace(
              "const gatewayUrl = String(process.env.AEGIS_GATEWAY_URL || '').replace(/\\/+$/, '');",
              "let gatewayUrl = '';\nlet gateway: any = null;",
              1,
          )
          marker = "(LIVE ? describe : describe.skip)('Aegis live remote-directory X3DH bootstrap', () => {"
          setup = r"""
beforeAll(async () => {
  gateway = createAegisServer({
    config: loadAegisConfig({
      SUPABASE_URL: supabaseUrl,
      SUPABASE_ANON_KEY: publishableKey,
      PORT: '0',
    }),
    logger: (record: Record<string, unknown>) => {
      console.log(`AEGIS_REMOTE_X3DH_GATEWAY ${JSON.stringify(record)}`);
    },
  });
  gateway.listen(0, '127.0.0.1');
  await once(gateway, 'listening');
  const address = gateway.address();
  if (!address || typeof address === 'string') throw new Error('LOCAL_GATEWAY_ADDRESS_MISSING');
  gatewayUrl = `http://127.0.0.1:${address.port}`;
});

afterAll(async () => {
  if (!gateway) return;
  gateway.close();
  await once(gateway, 'close').catch(() => undefined);
});

"""
          if marker not in source:
              raise SystemExit('live describe marker not found')
          source = source.replace(marker, setup + marker, 1)
          path.write_text(source)
          PY

      - name: Run live remote-directory X3DH bootstrap
        env:
          AEGIS_LIVE_REMOTE_X3DH: '1'
          SUPABASE_URL: https://vkpmoqfzrihcijjochks.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_API-35uviPFiptNrXqATAQ_8JtM7G_9
          VITE_SUPABASE_URL: https://vkpmoqfzrihcijjochks.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_API-35uviPFiptNrXqATAQ_8JtM7G_9
        run: npx vitest run src/lib/crypto/__tests__/aegisLiveRemoteX3DH.test.ts --reporter=verbose

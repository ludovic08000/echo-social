name: Aegis step 3 finalize

on:
  push:
    branches: [refactor/aegis-clean-rebuild]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/aegis-clean-rebuild
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch stale schema diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          hook = Path('src/hooks/useDeviceRegistration.ts')
          text = hook.read_text(encoding='utf-8')
          old = "migration: '20260728100000_sesame_per_device_identity.sql'"
          new = "migration: '20260730020000_aegis_account_authorized_devices.sql'"
          if text.count(old) != 1:
              raise SystemExit(f'unexpected stale diagnostic count: {text.count(old)}')
          hook.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('src/lib/messaging/__tests__/aegisStage3SchemaDiagnostic.test.ts')
          test.write_text("""import { readFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { describe, expect, it } from 'vitest';

          describe('Aegis stage 3 schema diagnostic', () => {
            it('points server repair at the account-authorized device migration', () => {
              const registration = readFileSync(
                resolve(process.cwd(), 'src/hooks/useDeviceRegistration.ts'),
                'utf8',
              );

              expect(registration).toContain(
                \"migration: '20260730020000_aegis_account_authorized_devices.sql'\",
              );
              expect(registration).not.toContain(
                \"migration: '20260728100000_sesame_per_device_identity.sql'\",
              );
            });
          });
          """, encoding='utf-8')
          PY

      - name: Targeted stage 3 tests
        run: npx vitest run src/lib/messaging/__tests__/aegisStage3Architecture.test.ts src/lib/messaging/__tests__/aegisStage3SchemaDiagnostic.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Full test suite
        run: npm run test

      - name: Build
        run: npm run build

      - name: Commit validated cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/aegis-step3-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/hooks/useDeviceRegistration.ts src/lib/messaging/__tests__/aegisStage3SchemaDiagnostic.test.ts .github/workflows/aegis-step3-finalize.yml
          git commit -m 'fix(aegis): point schema repair to stage 3 migration'
          git push origin HEAD:refactor/aegis-clean-rebuild

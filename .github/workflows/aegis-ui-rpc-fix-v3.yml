name: Aegis UI RPC compatibility validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aegis-ui-rpc-logic-fix
          fetch-depth: 0

      - name: Patch UI logic
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re

          def sub_once(path: str, pattern: str, replacement: str) -> None:
              source = Path(path)
              updated, count = re.subn(pattern, replacement, source.read_text(), count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {pattern}')
              source.write_text(updated)

          schedule = dedent('''\
          function scheduleKeysRestoredConversationRefetch(queryClient: QueryClient, userId: string) {
            if (keysRestoredConversationRefetchTimer) return;
            keysRestoredConversationRefetchTimer = setTimeout(() => {
              keysRestoredConversationRefetchTimer = null;
              console.log('[messaging] keys restored - refetch conversations');
              void queryClient.invalidateQueries({
                queryKey: ['conversations', userId],
                exact: true,
              });
            }, 500);
          }

          // Helper to get''')
          sub_once(
              'src/hooks/useMessages.ts',
              r'function scheduleKeysRestoredConversationRefetch\(queryClient: QueryClient\) \{.*?\n\}\n\n// Helper to get',
              schedule,
          )

          restored_effect = dedent('''\
            // A second widget mount must not invalidate the same user cache.
            useEffect(() => {
              if (!user?.id) return;
              const userId = user.id;
              const onRestored = () => {
                scheduleKeysRestoredConversationRefetch(queryClient, userId);
              };
              window.addEventListener('forsure-keys-restored', onRestored);
              return () => window.removeEventListener('forsure-keys-restored', onRestored);
            }, [user?.id, queryClient]);''')
          sub_once(
              'src/hooks/useMessages.ts',
              r'  // Force a refetch whenever the auth user changes.*?  \}, \[user\?\.id, queryClient\]\);',
              restored_effect,
          )

          messages = Path('src/hooks/useMessages.ts')
          text = messages.read_text()
          text, count = re.subn(
              r"    // Force a refetch on mount \+ when the network reconnects so a returning\n    // user always sees the server-side truth, never an old cached empty list\.\n    refetchOnMount: 'always',\n    refetchOnReconnect: 'always',\n    refetchOnWindowFocus: false,",
              "    // Explicit Aegis and realtime events refresh this user-scoped cache.\n    refetchOnMount: false,\n    refetchOnReconnect: true,\n    refetchOnWindowFocus: false,",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('useMessages.ts: refetch options did not match')
          messages.write_text(text)

          mark_read = dedent('''\
          export function useMarkConversationRead() {
            const queryClient = useQueryClient();
            const { user } = useAuth();

            return useMutation({
              mutationFn: async (conversationId: string) => {
                if (!user) throw new Error('Not authenticated');
                const { error } = await supabase
                  .from('conversation_participants')
                  .update({ last_read_at: new Date().toISOString() })
                  .eq('conversation_id', conversationId)
                  .eq('user_id', user.id);
                if (error) throw error;
                return conversationId;
              },
              onMutate: async (conversationId) => {
                if (!user?.id) return;
                const key = ['conversations', user.id] as const;
                await queryClient.cancelQueries({ queryKey: key, exact: true });
                const previous = queryClient.getQueryData<Conversation[]>(key);
                queryClient.setQueryData<Conversation[]>(key, (current) =>
                  current?.map((conversation) =>
                    conversation.id === conversationId
                      ? { ...conversation, unread_count: 0 }
                      : conversation
                  ) ?? [],
                );
                return { key, previous };
              },
              onError: (_error, _conversationId, context) => {
                if (context?.previous) queryClient.setQueryData(context.key, context.previous);
              },
            });
          }

          // Check if a conversation has pending''')
          sub_once(
              'src/hooks/useMessages.ts',
              r'export function useMarkConversationRead\(\) \{.*?\n\}\n\n// Check if a conversation has pending',
              mark_read,
          )

          chat = Path('src/components/ChatWidget.tsx')
          text = chat.read_text()
          pairs = [
              ('  const markRead = useMarkConversationRead();',
               '  const { mutate: markConversationRead } = useMarkConversationRead();'),
              ('        ) : messages?.length === 0 ? (',
               '        ) : (messages?.length ?? 0) === 0 && queue.pendingMessages.length === 0 ? ('),
              ('<div key={pm.localId} className="flex justify-start mt-1 px-2">',
               '<div key={pm.localId} className="flex justify-end mt-1 px-2">'),
          ]
          for old, new in pairs:
              if text.count(old) != 1:
                  raise SystemExit(f'ChatWidget.tsx: expected one match: {old}')
              text = text.replace(old, new, 1)
          chat.write_text(text)
          sub_once(
              'src/components/ChatWidget.tsx',
              r'  useEffect\(\(\) => \{\s*if \(conversationId\) markRead\.mutate\(conversationId\);\s*\}, \[conversationId, markRead\]\);',
              "  useEffect(() => {\n    if (conversationId) markConversationRead(conversationId);\n  }, [conversationId, markConversationRead]);",
          )
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Compatibility test
        run: npx vitest run src/lib/messaging/__tests__/aegisUiRpcCompatibility.test.ts
      - name: Full tests
        run: npm test
      - name: Build
        run: npm run build

      - name: Commit validated source
        shell: bash
        run: |
          rm -f .github/workflows/aegis-ui-rpc-fix.yml
          rm -f .github/workflows/aegis-ui-rpc-fix-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(aegis): align messaging UI with final RPC schema"
          git push origin HEAD:agent/aegis-ui-rpc-logic-fix

name: Aegis formatting cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aegis-ui-rpc-logic-fix
          fetch-depth: 0

      - name: Normalize useConversations formatting
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/hooks/useMessages.ts')
          text = path.read_text()
          old = """export function useConversations() {
            const { user } = useAuth();
            const queryClient = useQueryClient();

          // A second widget mount must not invalidate the same user cache.
          useEffect(() => {
            if (!user?.id) return;
            const userId = user.id;
            const onRestored = () => {
              scheduleKeysRestoredConversationRefetch(queryClient, userId);
            };
            window.addEventListener('forsure-keys-restored', onRestored);
            return () => window.removeEventListener('forsure-keys-restored', onRestored);
          }, [user?.id, queryClient]);

            return useQuery({"""
          new = """export function useConversations() {
            const { user } = useAuth();
            const queryClient = useQueryClient();

            // A second widget mount must not invalidate the same user cache.
            useEffect(() => {
              if (!user?.id) return;
              const userId = user.id;
              const onRestored = () => {
                scheduleKeysRestoredConversationRefetch(queryClient, userId);
              };
              window.addEventListener('forsure-keys-restored', onRestored);
              return () => window.removeEventListener('forsure-keys-restored', onRestored);
            }, [user?.id, queryClient]);

            return useQuery({"""
          # The strings above are indented by the Python heredoc. Normalize them.
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          if text.count(old) != 1:
            raise SystemExit(f'expected one formatting block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run src/lib/messaging/__tests__/aegisUiRpcCompatibility.test.ts src/lib/messaging/__tests__/aegisDeviceInbox.test.ts

      - name: Commit cleanup
        shell: bash
        run: |
          rm .github/workflows/aegis-format-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useMessages.ts .github/workflows/aegis-format-cleanup.yml
          git commit -m "style(aegis): normalize conversation hook formatting"
          git push origin HEAD:agent/aegis-ui-rpc-logic-fix

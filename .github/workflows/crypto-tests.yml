name: Crypto Test Suite

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/crypto/**'
      - 'src/lib/messaging/**'
      - 'src/test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - '.github/workflows/crypto-tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run guarded Signal audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Prepare audited workspace
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/aegis-pin-recovery-continuity-fix'
        run: node scripts/run-signal-audit-ci.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run crypto and messaging tests
        run: npm exec vitest run -- src/lib/crypto/__tests__ src/lib/messaging/__tests__

      - name: Run complete test suite
        run: npm run test

      - name: Build
        run: npm run build

      - name: Commit audited fixes
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/aegis-pin-recovery-continuity-fix'
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No audit changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(aegis): enforce Signal identity invariants"
          git push origin HEAD:${{ github.head_ref }}

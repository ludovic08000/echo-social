      - name: Validate patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import subprocess
          allowed = {
              'docs/AEGIS_CLEAN_REBUILD.md',
              'docs/AEGIS_E2EE_ARCHITECTURE.md',
              'src/hooks/useAegisMessageQueue.ts',
              'src/lib/messaging/aegisOutboundEngine.ts',
              'src/lib/messaging/aegisConversationQueue.ts',
              'src/lib/messaging/outboxVault.ts',
              'src/lib/crypto/deviceSessionQueue.ts',
              'src/lib/crypto/deviceIdentity.ts',
              'src/lib/crypto/crossTabLock.ts',
              'src/lib/crypto/deviceKx.ts',
              'src/lib/crypto/dbRegistry.ts',
              'src/lib/crypto/__tests__/crossTabLock.test.ts',
              'src/lib/messaging/__tests__/aegisConversationQueue.test.ts',
              'src/lib/messaging/__tests__/aegisOutboxAuthoritativeReceiptPolicy.test.ts',
              'src/lib/messaging/__tests__/outboxVault.test.ts',
          }
          changed = {line.strip() for line in subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines() if line.strip()}
          changed.update(line.strip() for line in subprocess.check_output(
              ['git', 'ls-files', '--others', '--exclude-standard'], text=True
          ).splitlines() if line.strip())
          if changed != allowed:
              raise SystemExit(f'unexpected patch scope: missing={sorted(allowed-changed)} extra={sorted(changed-allowed)}')
          PY

      - name: Targeted stage 4 tests
        run: |
          npx vitest run             src/lib/crypto/__tests__/crossTabLock.test.ts             src/lib/messaging/__tests__/outboxVault.test.ts             src/lib/messaging/__tests__/aegisConversationQueue.test.ts             src/lib/messaging/__tests__/aegisOutboxAuthoritativeReceiptPolicy.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Legacy repository lint
        continue-on-error: true
        run: npm run lint

      - name: Full test suite
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Commit validated stage 4
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/aegis-step4-implement.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add             docs/AEGIS_CLEAN_REBUILD.md             docs/AEGIS_E2EE_ARCHITECTURE.md             src/hooks/useAegisMessageQueue.ts             src/lib/messaging/aegisOutboundEngine.ts             src/lib/messaging/aegisConversationQueue.ts             src/lib/messaging/outboxVault.ts             src/lib/crypto/deviceSessionQueue.ts             src/lib/crypto/deviceIdentity.ts             src/lib/crypto/crossTabLock.ts             src/lib/crypto/deviceKx.ts             src/lib/crypto/dbRegistry.ts             src/lib/crypto/__tests__/crossTabLock.test.ts             src/lib/messaging/__tests__/aegisConversationQueue.test.ts             src/lib/messaging/__tests__/aegisOutboxAuthoritativeReceiptPolicy.test.ts             src/lib/messaging/__tests__/outboxVault.test.ts             .github/workflows/aegis-step4-implement.yml
          git diff --cached --check
          git commit -m 'feat(aegis): add durable cross-tab encrypted outbox'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

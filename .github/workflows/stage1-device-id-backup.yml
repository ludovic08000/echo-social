name: Stage 1 Device ID Backup Isolation

on:
  push:
    branches:
      - fix/ios-pin-device-enrollment
    paths:
      - .github/workflows/stage1-device-id-backup.yml

permissions:
  contents: write

concurrency:
  group: stage1-device-id-backup-isolation
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/ios-pin-device-enrollment
          fetch-depth: 0

      - name: Apply backup isolation patch
        shell: python
        run: |
          from pathlib import Path
          import re

          backup = Path('src/lib/crypto/accountKeyBackup.ts')
          text = backup.read_text(encoding='utf-8')

          old_import = "import { getCurrentDeviceId, adoptDeviceIdFromBackup } from '@/lib/messaging/currentDevice';"
          new_import = "import { getCurrentDeviceId } from '@/lib/messaging/currentDevice';\nimport { discardLegacyDeviceIdFromBackup } from '@/lib/crypto/deviceBackupPolicy';"
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('currentDevice import anchor missing')

          serialization_pattern = re.compile(
              r"\n\s*if \(includeDeviceSecrets\) \{\s*try \{\s*data\['device:id'\] = getCurrentDeviceId\(\);\s*\} catch \{\}\s*\}\s*\n",
              re.S,
          )
          text, serialization_count = serialization_pattern.subn('\n', text, count=1)
          if serialization_count != 1 and "data['device:id'] = getCurrentDeviceId();" in text:
              raise SystemExit('device:id serialization still present')

          parse_pattern = re.compile(
              r"  const data = JSON\.parse\(json\);\n  const isDeviceKeychain = data\?\._meta\?\.scope === 'device-keychain';"
          )
          parse_replacement = """  const data = JSON.parse(json) as Record<string, any>;
          const discardedLegacyDeviceId = discardLegacyDeviceIdFromBackup(data);
          if (discardedLegacyDeviceId) {
            console.info('[MasterKey] ignored legacy device routing id from backup');
          }
          const isDeviceKeychain = data?._meta?.scope === 'device-keychain';"""
          text, parse_count = parse_pattern.subn(parse_replacement, text, count=1)
          if parse_count != 1 and 'discardedLegacyDeviceId' not in text:
              raise SystemExit('restoreAllKeys parse anchor missing')

          phase_zero_pattern = re.compile(
              r"\n\s*// Phase 0: restore the encrypted device routing id.*?adoptDeviceIdFromBackup\(data\['device:id'\]\);\s*\}\s*\n",
              re.S,
          )
          text, phase_count = phase_zero_pattern.subn('\n', text, count=1)
          if phase_count != 1 and 'adoptDeviceIdFromBackup' in text:
              raise SystemExit('legacy device adoption still present')

          backup.write_text(text, encoding='utf-8')

          current = Path('src/lib/messaging/currentDevice.ts')
          current_text = current.read_text(encoding='utf-8')
          adopt_pattern = re.compile(
              r"/\*\*\n \* Adopt a device id coming from the ACCOUNT key backup.*?\nexport function adoptDeviceIdFromBackup\([^)]*\): string \{.*?\n\}\n\n(?=export function rotateCurrentDeviceId)",
              re.S,
          )
          replacement = """/**
           * Legacy compatibility only. Device routing identities are installation-local
           * and must never be restored from account or key snapshots. Older backups may
           * still contain `device:id`; callers receive the current local installation ID.
           */
          export function adoptDeviceIdFromBackup(_legacyId: string): string {
            console.info('[device-id] ignored legacy backup device id; using local installation identity');
            return getCurrentDeviceId();
          }

          """
          current_text, adopt_count = adopt_pattern.subn(replacement, current_text, count=1)
          if adopt_count != 1 and 'ignored legacy backup device id; using local installation identity' not in current_text:
              raise SystemExit(f'adoptDeviceIdFromBackup patch count={adopt_count}')
          current.write_text(current_text, encoding='utf-8')

          Path('src/lib/crypto/deviceBackupPolicy.ts').write_text("""/**
           * Device routing identity is local to one logical installation.
           * It is never portable account material and must not be restored from a blob.
           */
          export const LEGACY_DEVICE_ID_BACKUP_KEY = 'device:id' as const;

          export function discardLegacyDeviceIdFromBackup(
            data: Record<string, unknown>,
          ): boolean {
            if (!Object.prototype.hasOwnProperty.call(data, LEGACY_DEVICE_ID_BACKUP_KEY)) {
              return false;
            }
            delete data[LEGACY_DEVICE_ID_BACKUP_KEY];
            return true;
          }
          """, encoding='utf-8')

          Path('src/lib/crypto/__tests__/deviceBackupPolicy.test.ts').write_text("""import { describe, expect, it } from 'vitest';
          import {
            discardLegacyDeviceIdFromBackup,
            LEGACY_DEVICE_ID_BACKUP_KEY,
          } from '../deviceBackupPolicy';

          describe('device backup policy', () => {
            it('removes a legacy Windows DeviceID before an iOS restore', () => {
              const backup: Record<string, unknown> = {
                [LEGACY_DEVICE_ID_BACKUP_KEY]: 'windows-device-routing-id',
                'e2ee:identity-keys': [{ id: 'account-id' }],
                _meta: { scope: 'device-keychain' },
              };

              expect(discardLegacyDeviceIdFromBackup(backup)).toBe(true);
              expect(backup).not.toHaveProperty(LEGACY_DEVICE_ID_BACKUP_KEY);
              expect(backup['e2ee:identity-keys']).toEqual([{ id: 'account-id' }]);
            });

            it('leaves a modern backup unchanged', () => {
              const backup: Record<string, unknown> = {
                'e2ee:identity-keys': [{ id: 'account-id' }],
              };

              expect(discardLegacyDeviceIdFromBackup(backup)).toBe(false);
              expect(backup).toEqual({
                'e2ee:identity-keys': [{ id: 'account-id' }],
              });
            });
          });
          """, encoding='utf-8')

      - name: Assert no backup adoption remains
        shell: bash
        run: |
          ! grep -n "data\['device:id'\] =" src/lib/crypto/accountKeyBackup.ts
          ! grep -n "adoptDeviceIdFromBackup(data" src/lib/crypto/accountKeyBackup.ts
          grep -n "discardLegacyDeviceIdFromBackup" src/lib/crypto/accountKeyBackup.ts

      - name: Install dependencies
        run: npm ci

      - name: Run stage 1 test
        run: npx vitest run src/lib/crypto/__tests__/deviceBackupPolicy.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Commit stage 1
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/crypto/accountKeyBackup.ts \
            src/lib/messaging/currentDevice.ts \
            src/lib/crypto/deviceBackupPolicy.ts \
            src/lib/crypto/__tests__/deviceBackupPolicy.test.ts
          git commit -m "fix(e2ee): keep device ids out of restored backups"
          git push origin HEAD:fix/ios-pin-device-enrollment

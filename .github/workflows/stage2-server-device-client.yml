name: Stage 2 Server Device Enrollment Client

on:
  push:
    branches:
      - fix/ios-pin-device-enrollment
    paths:
      - .github/workflows/stage2-server-device-client.yml

permissions:
  contents: write

concurrency:
  group: stage2-server-device-enrollment-client
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/ios-pin-device-enrollment
          fetch-depth: 0

      - name: Patch resync and PIN enrollment flow
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/lib/crypto/resyncE2EE.ts')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              "  hydrateDeviceId,\n} from '@/lib/messaging/currentDevice';",
              "  hydrateDeviceId,\n  setCurrentDeviceId,\n} from '@/lib/messaging/currentDevice';",
              1,
          )
          enrollment_import = """import {
            beginServerAssignedDeviceEnrollment,
            completeServerAssignedDeviceEnrollment,
            hasRegisteredDevice,
            type DeviceEnrollmentChallenge,
          } from '@/lib/crypto/serverDeviceEnrollment';
          """
          identity_import = "import { prepareDeviceAuthorization } from '@/lib/crypto/deviceIdentity';\n"
          if enrollment_import not in text:
              if identity_import not in text:
                  raise SystemExit('deviceIdentity import anchor missing')
              text = text.replace(identity_import, identity_import + enrollment_import, 1)

          function_pattern = re.compile(
              r"async function republishDeviceIdentity\(.*?\n\}\n\n/\*\*\n \* Walk the recent inbox",
              re.S,
          )
          replacement = r'''async function republishDeviceIdentity(
            userId: string,
            deviceId: string,
            diag?: DiagRecorder,
          ): Promise<{
            identity: boolean;
            spk: boolean;
            opks: boolean;
            deviceId: string;
            serverAssigned: boolean;
          }> {
            const result = {
              identity: false,
              spk: false,
              opks: false,
              deviceId,
              serverAssigned: false,
            };

            diag?.push('identity', 'info', 'stage load_identity_keys');
            const keys = await getOrCreateIdentityKeys(userId).catch((e) => {
              throw new Error(`load_identity_keys: ${describeError(e)}`);
            });

            diag?.push('identity', 'info', 'stage export_public_bundle');
            let bundle: Awaited<ReturnType<typeof exportPublicKeyBundle>>;
            try {
              bundle = await exportPublicKeyBundle(keys);
            } catch (e) {
              const original = describeError(e);
              diag?.push('identity', 'warn', 'public CryptoKey export failed, trying stored JWK fallback', {
                error: original,
              });
              const storedBundle = await exportPublicKeyBundleFromStoredKeys(userId).catch((storedErr) => {
                throw new Error(`export_public_bundle: ${original}; stored_jwk_fallback: ${describeError(storedErr)}`);
              });
              if (!storedBundle) {
                throw new Error(`export_public_bundle: ${original}; stored_jwk_fallback: missing stored identity`);
              }
              bundle = storedBundle;
            }
            if (!bundle?.identityKey || !bundle?.signingKey || !keys?.signingPrivateKey) {
              throw new Error('identity bundle incomplete (identityKey/signingKey missing)');
            }

            const platform = normalizePlatform(getCurrentPlatform());
            const deviceName = (getCurrentDeviceLabel() || 'Unknown device').slice(0, 120);
            const userAgent = typeof navigator !== 'undefined'
              ? (navigator.userAgent || '').slice(0, 500)
              : null;
            let deviceFingerprint: string | null = null;
            try {
              const { getDeviceFingerprint } = await import('@/lib/messaging/currentDevice');
              deviceFingerprint = await getDeviceFingerprint();
            } catch {
              // Optional metadata. Device keys and the server challenge are authoritative.
            }

            let effectiveDeviceId = deviceId;
            let enrollmentChallenge: DeviceEnrollmentChallenge | null = null;
            const routeExists = await hasRegisteredDevice(userId, deviceId);
            if (!routeExists) {
              diag?.push('identity', 'info', 'stage server_device_id.begin', { platform });
              enrollmentChallenge = await beginServerAssignedDeviceEnrollment({
                deviceName,
                deviceFingerprint,
                platform,
                userAgent,
              });
              effectiveDeviceId = enrollmentChallenge.deviceId;
              result.deviceId = effectiveDeviceId;
              result.serverAssigned = true;
              diag?.push('identity', 'success', 'server DeviceID allocated', {
                deviceIdLength: effectiveDeviceId.length,
              });
            }

            let devicePublicKeyB64: string;
            try {
              diag?.push('identity', 'info', 'stage device_kx');
              const kx = await getOrCreateDeviceKxKey(effectiveDeviceId, userId);
              if (!kx?.publicB64 || !isNonEmptyB64(kx.publicB64)) {
                throw new Error('device kx public key missing');
              }
              devicePublicKeyB64 = kx.publicB64;
            } catch (e) {
              diag?.push('identity', 'error', 'device kx unavailable', {
                error: describeError(e),
              });
              throw new Error(`device_kx_unavailable: ${describeError(e)}`);
            }

            if (!userId || typeof userId !== 'string') {
              throw new Error(`invalid user_id type=${typeof userId}`);
            }
            if (!effectiveDeviceId || effectiveDeviceId.length < 8) {
              throw new Error(`invalid device_id (len=${effectiveDeviceId?.length ?? 0})`);
            }
            if (!isNonEmptyB64(devicePublicKeyB64)) {
              throw new Error(`invalid device_public_key type=${typeof devicePublicKeyB64} len=${devicePublicKeyB64.length}`);
            }

            const authorization = await prepareDeviceAuthorization(userId, effectiveDeviceId);
            if (authorization.deviceKx.publicB64 !== devicePublicKeyB64) {
              throw new Error('DEVICE_AUTHORIZATION_LOCAL_KEY_MISMATCH');
            }

            const payload = {
              user_id: userId,
              device_id: effectiveDeviceId,
              device_name: deviceName,
              device_public_key: devicePublicKeyB64,
              device_signing_key: authorization.deviceSigning.publicB64,
              device_authorization_signature: authorization.authorizationSignature,
              platform,
              user_agent: userAgent,
              is_active: true,
              last_seen_at: new Date().toISOString(),
              device_fingerprint: deviceFingerprint,
            };

            console.info('[resync] user device registration prepared', {
              device_id_len: payload.device_id.length,
              device_public_key_len: payload.device_public_key.length,
              user_agent_len: payload.user_agent?.length ?? 0,
              server_assigned: result.serverAssigned,
            });

            diag?.push('identity', 'info', 'stage user_devices.register', {
              deviceIdLen: payload.device_id.length,
              platform: payload.platform,
              devicePublicKeyLen: payload.device_public_key.length,
              serverAssigned: result.serverAssigned,
            });

            try {
              if (enrollmentChallenge) {
                const completedDeviceId = await completeServerAssignedDeviceEnrollment(
                  enrollmentChallenge,
                  authorization,
                );
                if (completedDeviceId !== effectiveDeviceId) {
                  throw new Error('DEVICE_ENROLLMENT_SERVER_ID_MISMATCH');
                }
                // Persistence occurs only after the server transaction succeeded.
                setCurrentDeviceId(completedDeviceId);
                result.deviceId = completedDeviceId;
                result.identity = true;
                diag?.push('identity', 'success', 'server device enrollment completed', {
                  deviceIdLength: completedDeviceId.length,
                });
              } else {
                const { data: registerData, error: registerErr } = await supabase.rpc('register_user_device_safe', {
                  p_user_id: payload.user_id,
                  p_device_id: payload.device_id,
                  p_device_name: payload.device_name,
                  p_device_public_key: payload.device_public_key,
                  p_device_fingerprint: payload.device_fingerprint,
                  p_platform: payload.platform,
                  p_user_agent: payload.user_agent,
                  p_device_signing_key: payload.device_signing_key,
                  p_device_authorization_signature: payload.device_authorization_signature,
                  p_account_identity_key: authorization.account.identityKey,
                  p_account_signing_key: authorization.account.signingKey,
                  p_account_fingerprint: authorization.account.fingerprint,
                  p_account_binding_signature: authorization.account.bindingSignature,
                });
                const registerResult = registerData as {
                  ok?: boolean;
                  code?: string;
                  message?: string;
                } | null;
                const code = String(registerResult?.code ?? registerResult?.message ?? '');
                if (registerErr) {
                  throw new Error(`E2EE_DB_RPC_FAILED table=user_devices step=register_user_device_safe message=${registerErr.message}`);
                }
                if (registerResult?.ok === true) {
                  result.identity = true;
                } else if (/DEVICE_APPROVAL_PENDING/i.test(code)) {
                  if (!(await hasLocalKeys())) {
                    throw new Error('DEVICE_APPROVAL_PENDING: local keys must be unlocked before device approval');
                  }
                  const { data: approveData, error: approveErr } = await supabase.rpc('approve_user_device', {
                    p_device_id: payload.device_id,
                  });
                  const approveResult = approveData as { ok?: boolean; code?: string } | null;
                  if (approveErr || approveResult?.ok !== true) {
                    throw new Error(`DEVICE_APPROVAL_PENDING: approve_user_device failed (${approveErr?.message ?? approveResult?.code ?? 'unknown'})`);
                  }
                  result.identity = true;
                } else {
                  throw new Error(`E2EE_DB_RPC_FAILED table=user_devices step=register_user_device_safe code=${code || 'UNKNOWN'}`);
                }
              }
            } catch (e) {
              console.error('[E2EE][IDENTITY][FAIL]', {
                step: enrollmentChallenge ? 'server_device_enrollment' : 'user_devices_register_safe',
                error: e,
                payload: sanitizePayloadForLog(payload),
              });
              throw e;
            }

            try {
              await refreshDeviceSignedPrekeyIfNeeded(
                userId,
                result.deviceId,
                authorization.deviceSigning.privateKey,
              );
              result.spk = true;
            } catch (e) {
              console.warn('[resync] device SPK refresh failed:', e);
            }

            try {
              await refillDeviceOneTimePrekeysIfNeeded(userId, result.deviceId);
              result.opks = true;
            } catch (e) {
              console.warn('[resync] OPK refill failed:', e);
            }

            return result;
          }

          /**
           * Walk the recent inbox'''
          text, count = function_pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'republishDeviceIdentity replacement count={count}')

          old_report = """    const pub = await republishDeviceIdentity(userId, deviceId, diag);
              report.steps.identity = pub.identity ? 'ok' : 'error';
          """
          new_report = """    const pub = await republishDeviceIdentity(userId, deviceId, diag);
              deviceId = pub.deviceId;
              report.deviceId = deviceId;
              report.steps.identity = pub.identity ? 'ok' : 'error';
          """
          if old_report not in text:
              raise SystemExit('resync report anchor missing')
          text = text.replace(old_report, new_report, 1)

          path.write_text(text, encoding='utf-8')

          pin = Path('src/components/PinValidatedMessaging.tsx')
          pin_text = pin.read_text(encoding='utf-8')
          old_pin = """        // A fresh registration starts in `repairing`. The restore path must
                // explicitly certify the route after the signed prekey is published.
                await markCurrentRouteReady(deviceId);
          """
          new_pin = """        if (report.deviceId && report.deviceId !== deviceId) {
                  deviceId = report.deviceId;
                  recordEnrollment(
                    'E2EE_DEVICE_ID_SERVER_ASSIGNED',
                    'ready',
                    'server_device_id',
                  );
                }

                // A fresh registration starts in `repairing`. The restore path must
                // explicitly certify the route after the signed prekey is published.
                await markCurrentRouteReady(deviceId);
          """
          if old_pin not in pin_text:
              raise SystemExit('PinValidated route-ready anchor missing')
          pin_text = pin_text.replace(old_pin, new_pin, 1)
          pin.write_text(pin_text, encoding='utf-8')

          current = Path('src/lib/messaging/currentDevice.ts')
          current_text = current.read_text(encoding='utf-8')
          current_text = current_text.replace(
              "console.log('[device-id] forcing device id from backup'",
              "console.log('[device-id] committing authoritative device id'",
              1,
          )
          current.write_text(current_text, encoding='utf-8')

      - name: Assert staged enrollment wiring
        shell: bash
        run: |
          grep -n "beginServerAssignedDeviceEnrollment" src/lib/crypto/resyncE2EE.ts
          grep -n "completeServerAssignedDeviceEnrollment" src/lib/crypto/resyncE2EE.ts
          grep -n "setCurrentDeviceId(completedDeviceId)" src/lib/crypto/resyncE2EE.ts
          grep -n "E2EE_DEVICE_ID_SERVER_ASSIGNED" src/components/PinValidatedMessaging.tsx

      - name: Install dependencies
        run: npm ci

      - name: Run enrollment tests
        run: npx vitest run src/lib/crypto/__tests__/deviceBackupPolicy.test.ts src/lib/crypto/__tests__/serverDeviceEnrollment.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Commit client stage 2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/crypto/resyncE2EE.ts \
            src/components/PinValidatedMessaging.tsx \
            src/lib/messaging/currentDevice.ts
          git commit -m "feat(e2ee): enroll missing devices with server-assigned ids"
          git push origin HEAD:fix/ios-pin-device-enrollment

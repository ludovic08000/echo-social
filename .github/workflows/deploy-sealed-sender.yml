name: Deploy Sealed Sender transport

on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/20260927172452_enable_sealed_sender_transport.sql
      - supabase/functions/_shared/sealedSenderToken.ts
      - supabase/functions/_shared/aegisDiagnostics.mjs
      - supabase/functions/sealed-mint-token/**
      - supabase/functions/sealed-relay/**
      - .github/workflows/deploy-sealed-sender.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-sealed-sender-transport
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_REF: vkpmoqfzrihcijjochks
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MIGRATION_FILE: supabase/migrations/20260927172452_enable_sealed_sender_transport.sql

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Supabase management token
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi

      - name: Apply Sealed Sender migration
        shell: bash
        run: |
          jq -Rs '{query: ., read_only: false}' "$MIGRATION_FILE" \
            > "$RUNNER_TEMP/migration-request.json"
          status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/migration-response.json" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/migration-request.json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query")"

          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "Sealed Sender migration failed with HTTP $status" >&2
            jq . "$RUNNER_TEMP/migration-response.json" >&2 || true
            exit 1
          fi

      - name: Verify database boundaries
        shell: bash
        run: |
          verification_sql="select
            to_regclass('public.sealed_sender_messages') is not null as queue_ready,
            to_regclass('public.sealed_sender_tokens') is not null as tokens_ready,
            to_regprocedure('public.relay_sealed_sender(text,text,integer,uuid,uuid,text,text,text,jsonb)') is not null as relay_ready,
            to_regprocedure('public.ack_sealed_sender_wakeups(uuid[])') is not null as ack_ready,
            not has_function_privilege('authenticated', 'public.relay_sealed_sender(text,text,integer,uuid,uuid,text,text,text,jsonb)', 'EXECUTE') as relay_private,
            has_function_privilege('service_role', 'public.relay_sealed_sender(text,text,integer,uuid,uuid,text,text,text,jsonb)', 'EXECUTE') as relay_service_only,
            not has_table_privilege('authenticated', 'public.sealed_sender_messages', 'INSERT') as direct_insert_blocked,
            exists (
              select 1 from pg_policies
              where schemaname = 'public'
                and tablename = 'sealed_sender_messages'
                and policyname = 'sealed messages recipient read'
            ) as recipient_rls_ready;"

          jq -n --arg query "$verification_sql" \
            '{query: $query, read_only: true}' \
            > "$RUNNER_TEMP/verification-request.json"
          status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/verification-response.json" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/verification-request.json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query")"

          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "Sealed Sender verification query failed with HTTP $status" >&2
            jq . "$RUNNER_TEMP/verification-response.json" >&2 || true
            exit 1
          fi

          jq -e '
            .. | objects |
            select(
              .queue_ready == true
              and .tokens_ready == true
              and .relay_ready == true
              and .ack_ready == true
              and .relay_private == true
              and .relay_service_only == true
              and .direct_insert_blocked == true
              and .recipient_rls_ready == true
            )
          ' "$RUNNER_TEMP/verification-response.json" > /dev/null

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Deploy authenticated token mint
        run: >-
          supabase functions deploy sealed-mint-token
          --project-ref "$PROJECT_REF"
          --no-verify-jwt

      - name: Deploy anonymous relay
        run: >-
          supabase functions deploy sealed-relay
          --project-ref "$PROJECT_REF"
          --no-verify-jwt

      - name: Verify deployed function boundaries
        shell: bash
        run: |
          mint_status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/mint-response.json" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://${PROJECT_REF}.supabase.co/functions/v1/sealed-mint-token")"
          if [ "$mint_status" != "401" ]; then
            echo "Expected unauthenticated mint to return 401, received $mint_status" >&2
            jq '{error: .error}' "$RUNNER_TEMP/mint-response.json" >&2 || true
            exit 1
          fi

          relay_status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/relay-response.json" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://${PROJECT_REF}.supabase.co/functions/v1/sealed-relay")"
          if [ "$relay_status" != "400" ]; then
            echo "Expected configured anonymous relay to return 400, received $relay_status" >&2
            jq '{error: .error}' "$RUNNER_TEMP/relay-response.json" >&2 || true
            exit 1
          fi

      - name: Publish deployment status
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_JOB_STATUS: ${{ job.status }}
        run: |
          case "$DEPLOY_JOB_STATUS" in
            success)
              state="success"
              description="Sealed Sender backend deployed and verified"
              ;;
            failure)
              state="failure"
              description="Sealed Sender backend deployment failed"
              ;;
            *)
              state="error"
              description="Sealed Sender backend deployment incomplete"
              ;;
          esac

          jq -n \
            --arg state "$state" \
            --arg context "Supabase/Sealed Sender" \
            --arg description "$description" \
            --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}' \
            > "$RUNNER_TEMP/status.json"

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary "@$RUNNER_TEMP/status.json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            > /dev/null

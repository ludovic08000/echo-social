name: Live iOS Windows Bidirectional

on:
  push:
    branches:
      - fix/ios-pin-device-enrollment
    paths:
      - .github/workflows/live-ios-windows-bidirectional.yml
      - src/lib/crypto/__tests__/liveIosWindowsBidirectional.test.ts
      - src/lib/crypto/serverDeviceEnrollment.ts
      - src/lib/crypto/deviceIdentity.ts
      - src/lib/crypto/x3dh.ts
      - src/lib/crypto/deviceRatchet.ts
      - src/lib/crypto/x3dhRatchetBootstrap.ts
      - infra/aegis-server/**

permissions:
  contents: read

concurrency:
  group: live-ios-windows-bidirectional
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AEGIS_LIVE_IOS_WINDOWS: '1'
      SUPABASE_URL: https://vkpmoqfzrihcijjochks.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_API-35uviPFiptNrXqATAQ_8JtM7G_9
      VITE_SUPABASE_URL: https://vkpmoqfzrihcijjochks.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_API-35uviPFiptNrXqATAQ_8JtM7G_9
      AEGIS_GATEWAY_URL: https://aegis.forsure.fans
      AEGIS_GATEWAY_ORIGIN: https://forsure.fans

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/ios-pin-device-enrollment

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run live iOS Windows bidirectional delivery
        run: npx vitest run src/lib/crypto/__tests__/liveIosWindowsBidirectional.test.ts --reporter=verbose

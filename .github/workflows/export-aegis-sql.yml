name: Export Aegis SQL

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'refactor/aegis-clean-rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify migration
        run: |
          set -euo pipefail
          test -f supabase/migrations/20260730090000_aegis_clean_rebuild.sql
          grep -q '^begin;$' supabase/migrations/20260730090000_aegis_clean_rebuild.sql
          grep -q '^commit;$' supabase/migrations/20260730090000_aegis_clean_rebuild.sql
      - name: Upload SQL
        uses: actions/upload-artifact@v4
        with:
          name: aegis-clean-rebuild-sql
          path: supabase/migrations/20260730090000_aegis_clean_rebuild.sql
          if-no-files-found: error
          retention-days: 1

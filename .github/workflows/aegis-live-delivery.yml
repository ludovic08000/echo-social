name: Aegis Anonymous Live Delivery

on:
  push:
    branches:
      - agent/aegis-durable-database
    paths:
      - 'infra/aegis-server/live-anonymous-delivery.mjs'
      - '.github/workflows/aegis-live-delivery.yml'

permissions:
  contents: read

concurrency:
  group: aegis-anonymous-live-delivery
  cancel-in-progress: true

jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Add required anonymous profile name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('infra/aegis-server/live-anonymous-delivery.mjs')
          source = path.read_text()
          old = "body: JSON.stringify({ data: { aegis_test_run: runId, aegis_test_label: label } }),"
          new = "body: JSON.stringify({ data: { name: 'Aegis Test ' + label, aegis_test_run: runId, aegis_test_label: label } }),"
          if old not in source:
              raise SystemExit('anonymous signup payload marker not found')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Syntax check
        run: node --check infra/aegis-server/live-anonymous-delivery.mjs

      - name: Anonymous send sync ack delivery
        working-directory: infra/aegis-server
        env:
          SUPABASE_URL: https://vkpmoqfzrihcijjochks.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_API-35uviPFiptNrXqATAQ_8JtM7G_9
        run: node live-anonymous-delivery.mjs

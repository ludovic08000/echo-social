name: E2EE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: vkpmoqfzrihcijjochks

    steps:
      - name: Checkout PR branch source
        uses: actions/checkout@v4
        with:
          ref: agent/force-ios-web-e2ee

      - name: Verify deployment credentials
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy approve-device-enrollment
        run: supabase functions deploy approve-device-enrollment --project-ref "$PROJECT_REF"

      - name: Verify deployed function rejects missing JWT
        shell: bash
        run: |
          endpoint="https://${PROJECT_REF}.supabase.co/functions/v1/approve-device-enrollment"
          status=$(curl --silent --show-error --output /tmp/approve-response.json --write-out "%{http_code}" \
            --request POST "$endpoint" \
            --header "Content-Type: application/json" \
            --data '{"device_id":"dev_00000000000000000000000000000000"}')
          cat /tmp/approve-response.json
          if [ "$status" != "401" ]; then
            echo "Expected HTTP 401 without JWT, received $status" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Legacy repository lint
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

name: E2EE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Apply PR53 final audit fixes
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/aegis-pin-recovery-continuity-fix'
        run: python scripts/apply_pr53_audit_fixes_v2.py

      - name: Commit audited fixes
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/aegis-pin-recovery-continuity-fix'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No audit changes to commit"
          else
            git commit -m "fix(aegis): close PR53 continuity audit blockers"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Legacy repository lint
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm run test -- --reporter=verbose 2>&1 | tee vitest-output.txt

      - name: Upload Vitest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-diagnostics
          path: vitest-output.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Build
        run: npm run build

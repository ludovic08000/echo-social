name: E2EE CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  finalize-stage3:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: refactor/aegis-clean-rebuild
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Download verified stage 3 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8751136572/zip" \
            --output /tmp/aegis-stage3-source.zip
          mkdir -p /tmp/aegis-stage3-source
          unzip -q /tmp/aegis-stage3-source.zip -d /tmp/aegis-stage3-source
          echo "e37732ec8cf93a8a8552048ef4fd0d63de5bd3ab9bf750509b014fa6b77ebf26  /tmp/aegis-stage3-source/aegis-stage3.tar.gz" | sha256sum --check
          tar -xzf /tmp/aegis-stage3-source/aegis-stage3.tar.gz -C .

      - name: Align generated types and executable fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          envelope = Path('src/lib/messaging/repeatablePreKeyEnvelope.ts')
          text = envelope.read_text()
          if 'async function readSession(' not in text:
              marker = 'async function readInitiating(key: string): Promise<InitiatingEnvelopeRecord | null> {'
              reader = '''async function readSession(key: string): Promise<StoredSessionRecord | null> {
            const value = await runTxOn('device-sessions', [SESSION_STORE], 'readonly', (tx) =>
              reqToPromise(tx.objectStore(SESSION_STORE).get(key) as IDBRequest<StoredSessionRecord | undefined>),
            );
            return value ?? null;
          }

          '''
              if marker not in text:
                  raise SystemExit('repeatable pre-key session insertion point not found')
              envelope.write_text(text.replace(marker, reader + marker, 1))

          send_test = Path('src/lib/messaging/__tests__/aegisSendRpc.test.ts')
          text = send_test.read_text()
          fixture_import = "import { VALID_INIT_COPY, VALID_RATCHET_COPY } from '@/test/aegisWireFixtures';\n"
          if fixture_import not in text:
              marker = "import { beforeEach, describe, expect, it, vi } from 'vitest';\n"
              if marker not in text:
                  raise SystemExit('vitest import marker not found')
              text = text.replace(marker, marker + fixture_import, 1)
          text = text.replace("encrypted_body: 'aegis1.ratchet.session.dh.0.0.iv.ct',", 'encrypted_body: VALID_RATCHET_COPY,')
          text = text.replace("encrypted_body: 'aegis1.init.v1.payload',", 'encrypted_body: VALID_INIT_COPY,')
          if 'encrypted_body: VALID_RATCHET_COPY,' not in text or 'encrypted_body: VALID_INIT_COPY,' not in text:
              raise SystemExit('active Aegis fixture replacement failed')
          if 'x3dh5.init.v3.obsolete' not in text:
              raise SystemExit('negative obsolete-wire test must remain')
          send_test.write_text(text)

          fanout_test = Path('src/lib/crypto/__tests__/multiDeviceFanoutOutOfOrder.test.ts')
          text = fanout_test.read_text()
          session_import = "import { createAegisSessionId } from '../aegisDeviceWire';\n"
          if session_import not in text:
              marker = "import { bufferToBase64, randomBytes } from '../utils';\n"
              if marker not in text:
                  raise SystemExit('fanout fixture import marker not found')
              text = text.replace(marker, marker + session_import, 1)
          old_session = """  const sessionId = bufferToBase64(randomBytes(8).buffer as ArrayBuffer)
            .replace(/[+/=]/g, '')
            .slice(0, 12);"""
          if old_session not in text:
              raise SystemExit('obsolete short session fixture not found')
          fanout_test.write_text(text.replace(old_session, '  const sessionId = createAegisSessionId();', 1))

          policy_test = Path('src/lib/messaging/__tests__/manualDeviceRevocationPolicy.test.ts')
          text = policy_test.read_text()
          old_assertion = "    expect(x3dh).toContain(\"rpc('quarantine_own_invalid_device_spk'\");\n"
          if old_assertion not in text:
              raise SystemExit('obsolete SPK quarantine assertion not found')
          replacement = (
              "    expect(x3dh).toContain('await generateAndUploadDeviceSignedPrekey');\n"
              "    expect(x3dh).toContain(\"rpc('publish_device_signed_prekey'\");\n"
          )
          policy_test.write_text(text.replace(old_assertion, replacement, 1))

          types = Path('src/integrations/supabase/types.ts')
          text = types.read_text()
          replacements = {
              '          device_identity_signature: string | null\n          device_identity_version: number\n': '          device_authorization_signature: string | null\n',
              '          device_identity_signature?: string | null\n          device_identity_version?: number\n': '          device_authorization_signature?: string | null\n',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'generated device identity block not found: {old!r}')
              text = text.replace(old, new)

          old_rpc = '''      register_user_device_safe: {
            Args: {
              p_device_fingerprint: string
              p_device_id: string
              p_device_name: string
              p_device_public_key: string
              p_platform: string
              p_user_agent: string
              p_user_id: string
            }
            Returns: Json
          }'''
          new_rpc = '''      register_user_device_safe: {
            Args: {
              p_account_binding_signature: string
              p_account_fingerprint: string
              p_account_identity_key: string
              p_account_signing_key: string
              p_device_authorization_signature: string
              p_device_fingerprint: string
              p_device_id: string
              p_device_name: string
              p_device_public_key: string
              p_device_signing_key: string
              p_platform: string
              p_user_agent: string
              p_user_id: string
            }
            Returns: Json
          }'''
          if old_rpc not in text:
              raise SystemExit('register_user_device_safe generated type block not found')
          text = text.replace(old_rpc, new_rpc, 1)
          if 'aegis_send_message:' not in text or 'Returns: Json' not in text:
              raise SystemExit('step 2 Aegis send return type was lost')
          types.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Targeted stage 3 tests
        run: |
          npx vitest run \
            src/lib/crypto/__tests__/aegisDeviceWire.test.ts \
            src/lib/crypto/__tests__/sesameDeviceIdentity.test.ts \
            src/lib/crypto/__tests__/x3dhOpkClaim.test.ts \
            src/lib/crypto/__tests__/deviceRatchet.test.ts \
            src/lib/crypto/__tests__/signalProtocolHardening.test.ts \
            src/lib/crypto/__tests__/multiDeviceIntegration.test.ts \
            src/lib/crypto/__tests__/multiDeviceFanoutOutOfOrder.test.ts \
            src/lib/messaging/__tests__/repeatablePreKeyEnvelope.test.ts \
            src/lib/messaging/__tests__/messageCompatibility.test.ts \
            src/lib/messaging/__tests__/aegisStage3Architecture.test.ts \
            src/lib/messaging/__tests__/aegisCrossPlatformDeviceCopy.test.ts \
            src/lib/messaging/__tests__/aegisOutboundEngine.test.ts \
            src/lib/messaging/__tests__/aegisSendRpc.test.ts \
            src/lib/messaging/__tests__/manualDeviceRevocationPolicy.test.ts

      - name: Full test suite
        run: npm run test

      - name: Build
        run: npm run build

      - name: Commit validated stage 3 and restore normal CI
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- public/version.json 2>/dev/null || true
          rm -rf .github/aegis-stage3-payload
          rm -f .github/workflows/finalize-aegis-stage3.yml
          rm -f .github/workflows/export-aegis-stage3.yml
          rm -f .github/workflows/apply-aegis-stage3.yml
          cat > .github/workflows/e2ee-ci.yml <<'YAML'
          name: E2EE CI

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
            workflow_dispatch:

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 30

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm

                - name: Install dependencies
                  run: npm ci

                - name: Legacy repository lint
                  continue-on-error: true
                  run: npm run lint

                - name: Typecheck
                  run: npm run typecheck

                - name: Test
                  run: npm run test

                - name: Build
                  run: npm run build
          YAML
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(aegis): authorize devices and harden protocol fanout"
          git push origin HEAD:refactor/aegis-clean-rebuild

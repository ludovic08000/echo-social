name: E2EE CI

on:
  push:
    branches: [main, fix/pending-device-global-gate]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Legacy repository lint
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        shell: bash
        run: |
          set +e
          npm run test 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2ee-ci-diagnostics
          retention-days: 2
          path: test-output.txt

      - name: Build
        run: npm run build

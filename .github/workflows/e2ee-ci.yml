name: E2EE CI

on:
  pull_request:
    branches: [refactor/aegis-modular-architecture]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.event_name == 'pull_request' && github.head_ref == 'hardening/aegis-signal-audit-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: hardening/aegis-signal-audit-v2
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate secure call-key fanout
        run: |
          python3 scripts/apply_secure_call_key_fanout.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib/calls/__tests__/secureCallSourcePolicy.test.ts')
          source = path.read_text(encoding='utf-8')
          source = source.replace("encrypted_call_key\\\\n  ) values", "encrypted_call_key\\n  ) values")
          path.write_text(source, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Secure call tests
        run: >-
          npx vitest run
          src/lib/calls/__tests__/secureCallKeys.test.ts
          src/lib/calls/__tests__/secureCallSourcePolicy.test.ts
          src/lib/messaging/__tests__/multiDeviceFanoutSecurity.test.ts
          src/lib/messaging/__tests__/fanoutSessionTransaction.test.ts
          src/lib/crypto/__tests__/multiDeviceIntegration.test.ts
          src/lib/crypto/__tests__/deviceRatchet.test.ts
          src/lib/messaging/__tests__/aegisWire.test.ts

      - name: Build
        run: npm run build

      - name: Restore normal CI and commit validated call hardening
        run: |
          git checkout -- public/version.json 2>/dev/null || true
          rm -f scripts/apply_secure_call_key_fanout.py
          cat > .github/workflows/e2ee-ci.yml <<'EOF'
          name: E2EE CI

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
            workflow_dispatch:

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 20

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm

                - name: Install dependencies
                  run: npm ci

                - name: Lint
                  run: npm run lint

                - name: Test
                  run: npm run test

                - name: Build
                  run: npm run build
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "security(calls): fan out LiveKit keys per trusted device"
          git push origin HEAD:hardening/aegis-signal-audit-v2

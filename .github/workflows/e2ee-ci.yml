name: E2EE CI

on:
  pull_request:
    branches: [refactor/aegis-modular-architecture]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.event_name == 'pull_request' && github.head_ref == 'hardening/aegis-signal-audit-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: hardening/aegis-signal-audit-v2
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate Signal hardening phase 1
        run: python3 scripts/apply_aegis_signal_hardening_v2.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Focused protocol tests
        run: >-
          npx vitest run
          src/lib/messaging/__tests__/aegisWire.test.ts
          src/lib/messaging/__tests__/aegisEnvelope.test.ts
          src/lib/messaging/__tests__/messageCompatibility.test.ts
          src/lib/messaging/__tests__/repeatablePreKeyEnvelope.test.ts
          src/lib/crypto/__tests__/accountAuthorizedDeviceIdentity.test.ts
          src/lib/crypto/__tests__/deviceRatchet.test.ts
          src/lib/crypto/__tests__/sesameDeviceIdentity.test.ts
          src/lib/crypto/__tests__/multiDeviceIntegration.test.ts
          src/e2ee-session/__tests__/deviceRegistryTrust.test.ts

      - name: Build
        run: npm run build

      - name: Restore normal CI and commit validated hardening
        run: |
          git checkout -- public/version.json 2>/dev/null || true
          rm -f scripts/apply_aegis_signal_hardening_v2.py
          cat > .github/workflows/e2ee-ci.yml <<'EOF'
          name: E2EE CI

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
            workflow_dispatch:

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 20

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm

                - name: Install dependencies
                  run: npm ci

                - name: Lint
                  run: npm run lint

                - name: Test
                  run: npm run test

                - name: Build
                  run: npm run build
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "security(aegis): authorize devices by account identity"
          git push origin HEAD:hardening/aegis-signal-audit-v2

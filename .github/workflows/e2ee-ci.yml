name: E2EE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.event_name == 'pull_request' && github.head_ref == 'refactor/aegis-modular-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/aegis-modular-architecture
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate modular Aegis architecture
        run: python3 scripts/refactor_aegis_modular.py

      - name: Apply strict module boundaries
        run: python3 scripts/refactor_aegis_postprocess.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Focused Aegis tests
        run: >-
          npx vitest run
          src/lib/aegis/__tests__
          src/lib/messaging/__tests__/aegisOutboundEngine.test.ts
          src/lib/messaging/__tests__/aegisDeviceRuntime.test.ts
          src/lib/messaging/__tests__/aegisSendRpc.test.ts
          src/lib/messaging/__tests__/messageCompatibility.test.ts
          src/lib/crypto/__tests__/multiDeviceIntegration.test.ts

      - name: Build
        run: npm run build

      - name: Restore normal CI and commit validated refactor
        run: |
          git checkout -- public/version.json 2>/dev/null || true
          rm -f scripts/refactor_aegis_modular.py scripts/refactor_aegis_postprocess.py
          cat > .github/workflows/e2ee-ci.yml <<'EOF'
          name: E2EE CI

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
            workflow_dispatch:

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 20

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm

                - name: Install dependencies
                  run: npm ci

                - name: Lint
                  run: npm run lint

                - name: Test
                  run: npm run test

                - name: Build
                  run: npm run build
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(aegis): split runtime into maintainable modules"
          git push origin HEAD:refactor/aegis-modular-architecture

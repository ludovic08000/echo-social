name: Finalize Aegis step 2

on:
  push:
    branches: [refactor/aegis-clean-rebuild]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/aegis-clean-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Finalize active transport implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          rpc = Path('src/lib/messaging/aegisSendRpc.ts')
          text = rpc.read_text()
          text = text.replace(
              'The server serializes calls for the same UUID and returns a signed-by-state\n * commit receipt containing the exact stored request digest.',
              'The server serializes calls for the same UUID and returns an authoritative\n * commit receipt containing the exact stored request digest.',
          )
          rpc.write_text(text)

          migration = Path('supabase/migrations/20260730010000_aegis_clean_transport.sql')
          migration.write_text(migration.read_text().replace('extensions.digest(', 'digest('))

          types = Path('src/integrations/supabase/types.ts')
          text = types.read_text()
          old = '''      aegis_send_message: {\n        Args: {\n          p_body: string\n          p_conversation_id: string\n          p_copies: Json\n          p_extra: Json\n          p_image_url: string\n          p_message_id: string\n          p_route_version: string\n          p_sender_device_id: string\n        }\n        Returns: string\n      }'''
          new = '''      aegis_send_message: {\n        Args: {\n          p_body: string\n          p_conversation_id: string\n          p_copies: Json\n          p_extra: Json\n          p_image_url: string\n          p_message_id: string\n          p_route_version: string\n          p_sender_device_id: string\n        }\n        Returns: Json\n      }'''
          if old not in text:
              raise SystemExit('aegis_send_message type block not found')
          types.write_text(text.replace(old, new))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted transport tests
        run: npx vitest run src/lib/messaging/__tests__/aegisSendRpc.test.ts src/lib/messaging/__tests__/aegisCleanTransportMigration.test.ts src/lib/messaging/__tests__/aegisOutboxAuthoritativeReceiptPolicy.test.ts
      - name: Full test suite
        run: npm run test
      - name: Build
        run: npm run build
      - name: Commit validated cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf .github/aegis-step2-payload
          rm -f .github/workflows/apply-aegis-step2.yml
          git add -A
          git commit -m "fix(aegis): finalize authoritative send receipts"
          git push origin HEAD:refactor/aegis-clean-rebuild

name: Apply Aegis stage 3

on:
  push:
    branches: [refactor/aegis-clean-rebuild]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/aegis-clean-rebuild
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct and apply stage 3
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/aegis-stage3-payload/p00 \
            .github/aegis-stage3-payload/p01 \
            .github/aegis-stage3-payload/p02 \
            .github/aegis-stage3-payload/p03 \
            .github/aegis-stage3-payload/p04 \
            .github/aegis-stage3-payload/p05 \
            .github/aegis-stage3-payload/p06 \
            .github/aegis-stage3-payload/p07 \
            .github/aegis-stage3-payload/p08 \
            .github/aegis-stage3-payload/t00 \
            .github/aegis-stage3-payload/t01 \
            .github/aegis-stage3-payload/t02 \
            .github/aegis-stage3-payload/t03 \
            .github/aegis-stage3-payload/t04 > /tmp/aegis-stage3.b64
          base64 --decode /tmp/aegis-stage3.b64 > /tmp/aegis-stage3.tar.gz
          echo "e37732ec8cf93a8a8552048ef4fd0d63de5bd3ab9bf750509b014fa6b77ebf26  /tmp/aegis-stage3.tar.gz" | sha256sum --check
          tar -xzf /tmp/aegis-stage3.tar.gz -C .

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Stage 3 protocol tests
        run: >-
          npx vitest run
          src/lib/crypto/__tests__/aegisDeviceWire.test.ts
          src/lib/crypto/__tests__/sesameDeviceIdentity.test.ts
          src/lib/crypto/__tests__/x3dhOpkClaim.test.ts
          src/lib/crypto/__tests__/deviceRatchet.test.ts
          src/lib/crypto/__tests__/signalProtocolHardening.test.ts
          src/lib/crypto/__tests__/multiDeviceIntegration.test.ts
          src/lib/messaging/__tests__/repeatablePreKeyEnvelope.test.ts
          src/lib/messaging/__tests__/messageCompatibility.test.ts
          src/lib/messaging/__tests__/aegisOutboundEngine.test.ts
          src/lib/messaging/__tests__/aegisCrossPlatformDeviceCopy.test.ts
          src/lib/messaging/__tests__/aegisStage3Architecture.test.ts

      - name: Full test suite
        run: npm run test

      - name: Build
        run: npm run build

      - name: Commit validated stage 3
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- public/version.json 2>/dev/null || true
          rm -rf .github/aegis-stage3-payload
          rm -f .github/workflows/export-aegis-stage3.yml
          rm -f .github/workflows/apply-aegis-stage3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(aegis): authorize devices from account identity"
          git push origin HEAD:refactor/aegis-clean-rebuild

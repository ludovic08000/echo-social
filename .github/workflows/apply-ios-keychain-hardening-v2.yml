name: Apply iOS Keychain hardening v2

on:
  push:
    branches:
      - agent/ios-keychain-atomic-enrollment
    paths:
      - .github/workflows/apply-ios-keychain-hardening-v2.yml
      - .github/scripts/apply-ios-keychain-hardening-fix.py

permissions:
  contents: write

concurrency:
  group: apply-ios-keychain-hardening-v2
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ios-keychain-atomic-enrollment
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply reviewed implementation
        run: |
          python3 .github/scripts/apply-ios-keychain-hardening.py
          python3 .github/scripts/apply-ios-keychain-hardening-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit verified implementation
        run: |
          rm -f .github/scripts/apply-ios-keychain-hardening.py
          rm -f .github/scripts/apply-ios-keychain-hardening-fix.py
          rm -f .github/workflows/apply-ios-keychain-hardening.yml
          rm -f .github/workflows/apply-ios-keychain-hardening-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(e2ee): make iOS enrollment Keychain-backed and route-tolerant"
          git push origin HEAD:agent/ios-keychain-atomic-enrollment

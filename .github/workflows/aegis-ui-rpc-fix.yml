name: Aegis UI RPC logic fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aegis-ui-rpc-logic-fix
          fetch-depth: 0

      - name: Apply targeted compatibility fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re

          def sub_once(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, found {count}\n--- pattern ---\n{pattern}")
              file.write_text(updated)

          inbox_source = dedent("""\
              import { supabase } from '@/integrations/supabase/client';
              import { ensureAegisDeviceReady } from '@/lib/messaging/aegisDeviceRuntime';
              import { traceE2EE } from '@/lib/messaging/e2eeTrace';

              export type AegisInboxRow = {
                message_id: string;
                encrypted_body: string;
                sender_user_id: string;
                sender_device_id: string;
                recipient_device_id: string;
                created_at: string;
              };

              let syncInflight: Promise<AegisInboxRow[]> | null = null;
              const acknowledged = new Set<string>();
              const delivered = new Set<string>();
              const MAX_LOCAL_CACHE = 1_000;

              function rememberBounded(cache: Set<string>, key: string): void {
                cache.add(key);
                while (cache.size > MAX_LOCAL_CACHE) {
                  const oldest = cache.values().next().value;
                  if (oldest === undefined) break;
                  cache.delete(oldest);
                }
              }

              function dispatchInboxRow(row: AegisInboxRow, deviceId: string): void {
                const deliveryKey = `${deviceId}:${row.message_id}`;
                if (delivered.has(deliveryKey)) return;
                rememberBounded(delivered, deliveryKey);
                traceE2EE({
                  direction: 'receive',
                  stage: 'SERVER_INBOX_DELIVERY',
                  messageId: row.message_id,
                  deviceId,
                  peerDeviceId: row.sender_device_id,
                });
                window.dispatchEvent(new CustomEvent('forsure-decrypt-retry', {
                  detail: {
                    messageId: row.message_id,
                    reason: 'aegis-device-copy',
                  },
                }));
              }

              /**
               * Catch up the current authorized device with the final Aegis schema.
               *
               * The clean migration removes aegis_sync_device and
               * aegis_ack_device_messages. The canonical server path is the
               * get_device_copies_for_messages RPC over message_device_copies.
               */
              export async function syncAegisDeviceInbox(userId: string): Promise<AegisInboxRow[]> {
                if (syncInflight) return syncInflight;

                syncInflight = (async () => {
                  const ready = await ensureAegisDeviceReady(userId);
                  const { data: references, error: referenceError } = await supabase
                    .from('message_device_copies')
                    .select('message_id')
                    .eq('recipient_user_id', userId)
                    .order('created_at', { ascending: false })
                    .limit(100);
                  if (referenceError) throw referenceError;

                  const messageIds = Array.from(new Set(
                    (references ?? [])
                      .map((row) => row.message_id)
                      .filter((id): id is string => typeof id === 'string' && id.length > 0),
                  ));
                  if (messageIds.length === 0) return [];

                  const { data, error } = await supabase.rpc('get_device_copies_for_messages', {
                    p_message_ids: messageIds,
                    p_device_id: ready.deviceId,
                  });
                  if (error) throw error;

                  const rows = (data ?? []) as AegisInboxRow[];
                  for (const row of rows) dispatchInboxRow(row, ready.deviceId);
                  return rows;
                })().finally(() => {
                  syncInflight = null;
                });

                return syncInflight;
              }

              /**
               * The final schema has no server acknowledgement RPC. Authenticated
               * decryption is persisted by decryptionService; this bounded marker
               * only prevents duplicate local work and misleading network errors.
               */
              export async function acknowledgeAegisMessage(
                userId: string,
                messageId: string,
                markRead = false,
              ): Promise<void> {
                if (!userId || !messageId) return;
                const key = `${userId}:${messageId}:${markRead ? 'read' : 'delivered'}`;
                if (acknowledged.has(key)) return;
                rememberBounded(acknowledged, key);
                traceE2EE({
                  direction: 'receive',
                  stage: markRead ? 'MESSAGE_READ_LOCAL' : 'MESSAGE_DECRYPTED_LOCAL',
                  messageId,
                });
              }

              export function startAegisDeviceInbox(userId: string): () => void {
                if (!userId) return () => {};
                let stopped = false;
                let timer: ReturnType<typeof setInterval> | null = null;

                const sync = () => {
                  if (stopped || document.visibilityState === 'hidden' || !navigator.onLine) return;
                  void syncAegisDeviceInbox(userId).catch((error) => {
                    traceE2EE({
                      direction: 'receive',
                      stage: 'SERVER_INBOX_SYNC_FAILED',
                      errorCode: error instanceof Error ? error.message.slice(0, 120) : 'UNKNOWN',
                    }, 'warn');
                  });
                };

                const channel = supabase
                  .channel(`aegis-device-inbox:${userId}`)
                  .on(
                    'postgres_changes',
                    {
                      event: 'INSERT',
                      schema: 'public',
                      table: 'message_device_copies',
                      filter: `recipient_user_id=eq.${userId}`,
                    },
                    sync,
                  )
                  .subscribe((status) => {
                    if (status === 'SUBSCRIBED') sync();
                  });

                sync();
                timer = setInterval(sync, 30_000);
                window.addEventListener('online', sync);
                window.addEventListener('focus', sync);
                document.addEventListener('visibilitychange', sync);

                return () => {
                  stopped = true;
                  if (timer) clearInterval(timer);
                  window.removeEventListener('online', sync);
                  window.removeEventListener('focus', sync);
                  document.removeEventListener('visibilitychange', sync);
                  void supabase.removeChannel(channel);
                };
              }
          """)
          Path("src/lib/messaging/aegisDeviceInbox.ts").write_text(inbox_source)

          schedule_replacement = dedent("""\
              function scheduleKeysRestoredConversationRefetch(queryClient: QueryClient, userId: string) {
                if (keysRestoredConversationRefetchTimer) return;
                keysRestoredConversationRefetchTimer = setTimeout(() => {
                  keysRestoredConversationRefetchTimer = null;
                  console.log('[messaging] keys restored - refetch conversations');
                  void queryClient.invalidateQueries({
                    queryKey: ['conversations', userId],
                    exact: true,
                  });
                }, 500);
              }

              // Helper to get
          """)
          sub_once(
              "src/hooks/useMessages.ts",
              r"function scheduleKeysRestoredConversationRefetch\(queryClient: QueryClient\) \{.*?\n\}\n\n// Helper to get",
              schedule_replacement,
          )

          effect_replacement = dedent("""\
                // Listen only for a real key restoration. The query key is already
                // user-scoped, so mounting another widget must not invalidate it.
                useEffect(() => {
                  if (!user?.id) return;
                  const userId = user.id;
                  const onRestored = () => {
                    scheduleKeysRestoredConversationRefetch(queryClient, userId);
                  };
                  window.addEventListener('forsure-keys-restored', onRestored);
                  return () => window.removeEventListener('forsure-keys-restored', onRestored);
                }, [user?.id, queryClient]);
          """)
          sub_once(
              "src/hooks/useMessages.ts",
              r"  // Force a refetch whenever the auth user changes.*?  \}, \[user\?\.id, queryClient\]\);",
              effect_replacement.rstrip(),
          )

          messages_path = Path("src/hooks/useMessages.ts")
          messages_text = messages_path.read_text()
          old_refetch = """    // Force a refetch on mount + when the network reconnects so a returning
              // user always sees the server-side truth, never an old cached empty list.
              refetchOnMount: 'always',
              refetchOnReconnect: 'always',
              refetchOnWindowFocus: false,"""
          new_refetch = """    // Explicit Aegis and realtime events refresh this user-scoped cache.
              refetchOnMount: false,
              refetchOnReconnect: true,
              refetchOnWindowFocus: false,"""
          if messages_text.count(old_refetch) != 1:
              raise SystemExit("useMessages.ts: conversation refetch options did not match once")
          messages_path.write_text(messages_text.replace(old_refetch, new_refetch, 1))

          mark_read_replacement = dedent("""\
              export function useMarkConversationRead() {
                const queryClient = useQueryClient();
                const { user } = useAuth();

                return useMutation({
                  mutationFn: async (conversationId: string) => {
                    if (!user) throw new Error('Not authenticated');

                    const { error } = await supabase
                      .from('conversation_participants')
                      .update({ last_read_at: new Date().toISOString() })
                      .eq('conversation_id', conversationId)
                      .eq('user_id', user.id);

                    if (error) throw error;
                    return conversationId;
                  },
                  onMutate: async (conversationId) => {
                    if (!user?.id) return;
                    const key = ['conversations', user.id] as const;
                    await queryClient.cancelQueries({ queryKey: key, exact: true });
                    const previous = queryClient.getQueryData<Conversation[]>(key);
                    queryClient.setQueryData<Conversation[]>(key, (current) =>
                      current?.map((conversation) =>
                        conversation.id === conversationId
                          ? { ...conversation, unread_count: 0 }
                          : conversation
                      ) ?? [],
                    );
                    return { key, previous };
                  },
                  onError: (_error, _conversationId, context) => {
                    if (context?.previous) {
                      queryClient.setQueryData(context.key, context.previous);
                    }
                  },
                });
              }

              // Check if a conversation has pending
          """)
          sub_once(
              "src/hooks/useMessages.ts",
              r"export function useMarkConversationRead\(\) \{.*?\n\}\n\n// Check if a conversation has pending",
              mark_read_replacement,
          )

          chat_path = Path("src/components/ChatWidget.tsx")
          chat = chat_path.read_text()
          replacements = [
              (
                  "  const markRead = useMarkConversationRead();",
                  "  const { mutate: markConversationRead } = useMarkConversationRead();",
              ),
              (
                  """  useEffect(() => {
                  if (conversationId) markRead.mutate(conversationId);
                }, [conversationId, markRead]);""",
                  """  useEffect(() => {
                  if (conversationId) markConversationRead(conversationId);
                }, [conversationId, markConversationRead]);""",
              ),
              (
                  "        ) : messages?.length === 0 ? (",
                  "        ) : (messages?.length ?? 0) === 0 && queue.pendingMessages.length === 0 ? (",
              ),
              (
                  '<div key={pm.localId} className="flex justify-start mt-1 px-2">',
                  '<div key={pm.localId} className="flex justify-end mt-1 px-2">',
              ),
          ]
          for old, new in replacements:
              count = chat.count(old)
              if count != 1:
                  raise SystemExit(f"ChatWidget.tsx: expected one match, found {count}: {old}")
              chat = chat.replace(old, new, 1)
          chat_path.write_text(chat)

          test_source = dedent("""\
              import { readFileSync } from 'node:fs';
              import { describe, expect, it } from 'vitest';

              const read = (path: string) => readFileSync(path, 'utf8');

              describe('Aegis UI and final schema compatibility', () => {
                it('uses only the final device-copy RPC path', () => {
                  const source = read('src/lib/messaging/aegisDeviceInbox.ts');
                  expect(source).toContain('get_device_copies_for_messages');
                  expect(source).not.toContain("'aegis_sync_device'");
                  expect(source).not.toContain("'aegis_ack_device_messages'");
                });

                it('renders a pending bubble before the first server message exists', () => {
                  const source = read('src/components/ChatWidget.tsx');
                  expect(source).toContain(
                    '(messages?.length ?? 0) === 0 && queue.pendingMessages.length === 0',
                  );
                  expect(source).toContain(
                    'key={pm.localId} className="flex justify-end mt-1 px-2"',
                  );
                });

                it('does not bind mark-read to an unstable mutation result object', () => {
                  const source = read('src/components/ChatWidget.tsx');
                  expect(source).toContain(
                    'const { mutate: markConversationRead } = useMarkConversationRead();',
                  );
                  expect(source).toContain('[conversationId, markConversationRead]');
                  expect(source).not.toContain('[conversationId, markRead]');
                });

                it('does not force conversation refetch on every widget mount', () => {
                  const source = read('src/hooks/useMessages.ts');
                  expect(source).toContain("queryKey: ['conversations', userId]");
                  expect(source).toContain('refetchOnMount: false');
                  expect(source).not.toContain("refetchOnMount: 'always'");
                });
              });
          """)
          Path("src/lib/messaging/__tests__/aegisUiRpcCompatibility.test.ts").write_text(test_source)

          runtime = "\n".join(
              Path(path).read_text()
              for path in [
                  "src/lib/messaging/aegisDeviceInbox.ts",
                  "src/hooks/useMessages.ts",
                  "src/components/ChatWidget.tsx",
              ]
          )
          if "'aegis_sync_device'" in runtime or "'aegis_ack_device_messages'" in runtime:
              raise SystemExit("obsolete Aegis inbox RPC call remains in runtime code")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Compatibility tests
        run: npx vitest run src/lib/messaging/__tests__/aegisUiRpcCompatibility.test.ts

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit validated fix
        shell: bash
        run: |
          rm .github/workflows/aegis-ui-rpc-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/messaging/aegisDeviceInbox.ts \
                  src/hooks/useMessages.ts \
                  src/components/ChatWidget.tsx \
                  src/lib/messaging/__tests__/aegisUiRpcCompatibility.test.ts \
                  .github/workflows/aegis-ui-rpc-fix.yml
          git commit -m "fix(aegis): align messaging UI with final RPC schema"
          git push origin HEAD:agent/aegis-ui-rpc-logic-fix

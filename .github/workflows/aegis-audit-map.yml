name: Aegis architecture map

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build audit map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          {
            echo '# Aegis repository files'
            find src supabase .github -type f | sort | grep -Ei 'aegis|e2ee|ratchet|x3dh|device|prekey|message|call|livekit|backup|recovery|fingerprint|view.once' || true
            echo
            echo '# SQL Aegis functions and objects'
            grep -RInE --include='*.sql' 'aegis_send_message|register_user_device_safe|get_signed_device_list|message_device_copies|active_calls|call_invites|livekit|backup_pin_state|user_backups' supabase/migrations || true
            echo
            echo '# Skipped tests'
            grep -RInE --include='*.ts' --include='*.tsx' '(it|test|describe)\.skip|skip:[[:space:]]*true' src || true
            echo
            echo '# Aegis imports and runtime entry points'
            grep -RInE --include='*.ts' --include='*.tsx' "sendAegisOutboundMessage|useAegisMessageQueue|useMessageQueue|startGroupCall|signalOutgoingCall|getLiveKitToken|@/lib/aegis|@/lib/messaging|@/lib/crypto" src || true
            echo
            echo '# Direct message table access'
            grep -RInE --include='*.ts' --include='*.tsx' "from\(['\"]messages['\"]\)|\.from\(['\"]messages['\"]\)" src supabase/functions || true
            echo
            echo '# Migrations ordered'
            find supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort
          } > audit/aegis-map.txt
          tar --exclude='.git' --exclude='node_modules' --exclude='dist' -czf audit/echo-social-source.tar.gz \
            src supabase .github scripts package.json package-lock.json tsconfig*.json vite.config.ts vitest.config.ts 2>/dev/null || \
          tar --exclude='.git' --exclude='node_modules' --exclude='dist' -czf audit/echo-social-source.tar.gz \
            src supabase .github scripts package.json package-lock.json tsconfig*.json vite.config.ts
      - uses: actions/upload-artifact@v4
        with:
          name: aegis-architecture-map
          path: audit/aegis-map.txt
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: echo-social-source-snapshot
          path: audit/echo-social-source.tar.gz
          retention-days: 1

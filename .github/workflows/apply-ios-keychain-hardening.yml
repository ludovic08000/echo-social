name: Apply iOS Keychain hardening

on:
  push:
    branches:
      - agent/ios-keychain-atomic-enrollment
    paths:
      - .github/workflows/apply-ios-keychain-hardening.yml
      - .github/scripts/apply-ios-keychain-hardening.py

permissions:
  contents: write

concurrency:
  group: apply-ios-keychain-hardening
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ios-keychain-atomic-enrollment
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply reviewed patch
        run: python3 .github/scripts/apply-ios-keychain-hardening.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit verified implementation
        run: |
          rm -f .github/scripts/apply-ios-keychain-hardening.py
          rm -f .github/workflows/apply-ios-keychain-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/secureStore.ts \
            src/lib/crypto/nativeKeyVault.ts \
            src/lib/crypto/deviceIdentity.ts \
            src/lib/crypto/deviceKx.ts \
            src/lib/crypto/x3dh.ts \
            src/lib/crypto/resyncE2EE.ts \
            src/lib/crypto/__tests__/iosNativeKeyVault.test.ts \
            src/lib/crypto/__tests__/iosDeviceRoutingMigration.test.ts \
            supabase/migrations/20260805164500_require_active_spk_for_device_routing.sql \
            .github/scripts/apply-ios-keychain-hardening.py \
            .github/workflows/apply-ios-keychain-hardening.yml
          git commit -m "fix(e2ee): make iOS enrollment Keychain-backed and atomic"
          git push origin HEAD:agent/ios-keychain-atomic-enrollment
